<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14284b">
<title>FinSpeak — مصطلحات المحاسبة والبيزنس بالصوت</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="FinSpeak">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#17212f;--mut:#6a7584;--line:#e3e8e6;--navy:#14284b;--navy2:#1d3a68;--g:#0d4a57;--g2:#13606f;--gs:#e1eef0;--gt:#0d4a57;--warn:#fff3e0;--wt:#a8580c;--red:#c2412d;--rs:#fdecea;--sh:0 1px 2px rgba(16,30,50,.05),0 4px 14px rgba(16,30,50,.06)}
[data-theme=dark]{--bg:#0e141c;--card:#17202b;--ink:#e9eef2;--mut:#93a0ad;--line:#26313d;--navy:#0c1a30;--navy2:#132849;--g:#4fb7c7;--g2:#13606f;--gs:#14333a;--gt:#86d3de;--warn:#33270f;--wt:#f2b366;--red:#ef7a66;--rs:#3a1f1b;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:Inter,"IBM Plex Sans",sans-serif;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:720px;margin:0 auto}
/* header */
.top{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 54px;border-radius:0 0 26px 26px}
.hrow{display:flex;align-items:center;gap:10px}
.hi{font-size:1.45rem;font-weight:700;line-height:1.3}
.hi b{color:#f2c25c}
.hd{opacity:.75;font-size:.9rem}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.top.small .logo{width:36px;height:36px}
.brand{font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.3px}.brand b{color:#f2b33d}
.pill{margin-inline-start:auto;background:rgba(255,255,255,.13);border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap;font-size:.92rem}
.sbox{display:flex;align-items:center;gap:8px;background:#fff;color:#17212f;border-radius:14px;padding:0 14px;margin-top:14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sbox input{border:0;outline:0;background:transparent;flex:1;padding:13px 0;font-size:1rem;color:#17212f;min-width:0}
.sbox svg{color:#7c8794}
.top.small{padding-bottom:22px}
.top.small .sbox{display:none}
.top.small .hi{font-size:1.2rem}
main{padding:0 14px calc(96px + env(safe-area-inset-bottom))}
.lift{margin-top:-38px}
/* cards */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 8px}
.sec h2{font-size:1.06rem;margin:0}
.sec a,.link{color:var(--g);font-weight:600;font-size:.9rem;background:none;border:0;padding:0}
.goal{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;line-height:1.1}
.ring .n small{font-size:.7rem;color:var(--mut);font-weight:500}
.goal h3{margin:0 0 2px;font-size:1.05rem}
.goal p{margin:0 0 10px;color:var(--mut);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px 16px;min-height:44px;font-weight:600}
.btn.pr{background:var(--g);border-color:var(--g);color:#fff}
[data-theme=dark] .btn.pr{color:#08130e}
.btn.soft{background:var(--gs);border-color:transparent;color:var(--gt)}
.btn.bad{background:var(--rs);border-color:transparent;color:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.78rem;color:var(--mut)}
.week{display:flex;justify-content:space-between;margin-top:14px;gap:4px}
.wd{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}
.wd i{display:flex;margin:4px auto 0;width:30px;height:30px;border-radius:50%;background:var(--bg);align-items:center;justify-content:center;font-style:normal;font-size:.85rem;border:2px solid transparent}
.wd.ok i{background:var(--g);color:#fff}
.wd.now i{border-color:var(--g)}
/* term of day */
.tod{background:#0d4a57;color:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 22px rgba(13,74,87,.3);margin-bottom:14px}
.tod .lb{color:#f2c25c}
.tod .lb{opacity:.85;font-size:.85rem;display:flex;align-items:center;gap:6px}
.tod .w{font-size:1.65rem;font-weight:800;margin:4px 0 0;line-height:1.25;text-align:left}
.tod .ar{font-weight:700;font-size:1.1rem;margin-top:2px}
.tod p{margin:8px 0 10px;opacity:.95;font-size:.93rem}
.tod .tb{display:flex;gap:8px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--gs);color:var(--gt);padding:0 11px;font-weight:600;font-size:.88rem}
.tod .ib{background:rgba(255,255,255,.17);border-color:transparent;color:#fff}
.ib.on{background:var(--g);color:#fff;border-color:var(--g)}
.tod .ib.on{background:#fff;color:#0d4a57}
.ib.star.fav{background:#f2a33a;border-color:#f2a33a;color:#fff}
.ib.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--g);color:var(--g);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;min-height:38px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff}
[data-theme=dark] .chip.on{color:#08130e}
.chip.gray{border-color:var(--line);color:var(--mut)}
.chip.gray.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.catb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:right;box-shadow:var(--sh)}
.catb b{display:block;font-size:.95rem}
.catb span{font-size:.8rem;color:var(--mut)}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
/* rows */
.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);cursor:pointer}
.row .rt{flex:1;min-width:0}
.row .re{font-weight:700;font-size:1.02rem;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ra{color:var(--mut);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.72rem;border-radius:999px;padding:2px 9px;white-space:nowrap;font-weight:600}
.b-new{background:var(--bg);color:var(--mut)}
.b-ok{background:var(--gs);color:var(--gt)}
.b-weak{background:var(--warn);color:var(--wt)}
.b-cat{background:var(--gs);color:var(--gt)}
.count{color:var(--mut);font-size:.85rem;margin:2px 4px 8px}
/* detail */
.dt .dh{display:flex;gap:6px;flex-wrap:wrap}
.dt .w{font-size:1.75rem;font-weight:800;text-align:left;margin:8px 0 2px;line-height:1.25;word-break:break-word}
.hint{display:inline-block;background:var(--warn);color:var(--wt);border-radius:9px;padding:1px 10px;font-size:.85rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.pron{min-height:1.5em;font-size:.9rem;color:var(--mut)}
.pron.good{color:var(--g)}.pron.mid{color:var(--wt)}.pron.bad{color:var(--red)}
.dt .ar{font-size:1.2rem;font-weight:700;color:var(--g);margin-top:6px}
.dt .ex{margin:6px 0 10px}
.sent{display:flex;gap:10px;align-items:flex-start;background:var(--gs);border-radius:14px;padding:10px 12px}
.sent .se{display:block;text-align:left;font-weight:600}
.sent .sa{display:block;color:var(--mut);font-size:.9rem}
.sent .ib{background:var(--card)}
.sent .ib.on{background:var(--g);color:#fff;border-color:var(--g)}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);border-inline-start:4px solid var(--g)}
.dcard .top2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcard .w{flex:1;min-width:160px;font-size:1.25rem;font-weight:800;text-align:left;line-height:1.3;word-break:break-word}
.dcard .ib{min-width:40px;height:40px}
.dcard .ar{font-size:1.08rem;font-weight:700;color:var(--g);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dcard .pron:empty{min-height:0}
.dcard .ex{margin:6px 0 10px}
.grp{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;margin:18px 0 10px;font-weight:700}
.grp span{font-weight:500;opacity:.8;font-size:.85rem}
.dtools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 4px 10px;flex-wrap:wrap}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(8,14,24,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.x{float:left;border:0;background:var(--bg);border-radius:50%;width:36px;height:36px}
/* study */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog .bar{flex:1;height:9px;margin:0;background:var(--card);border:1px solid var(--line)}
.prog span{font-weight:700;font-size:.9rem;color:var(--mut)}
.flash{text-align:center;padding:22px 16px}
.flash .w{font-size:2.1rem;font-weight:800;margin:10px 0 4px;word-break:break-word;line-height:1.2}
.flash .ctrl{justify-content:center}
.flash .fback{text-align:right;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.src{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.src .em{font-size:1.5rem;width:46px;height:46px;border-radius:14px;background:var(--gs);display:flex;align-items:center;justify-content:center;flex:none}
.src b{display:block}
.src span{color:var(--mut);font-size:.85rem}
.src .num{margin-inline-start:auto;font-weight:800;color:var(--g);font-size:1.15rem}
.done{text-align:center;padding:26px 16px}
.done .big{font-size:3rem}
/* quiz */
.opt{display:block;width:100%;text-align:right;margin:9px 0;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:500;min-height:50px}
.opt.en{text-align:left}
.opt.ok{background:var(--g);border-color:var(--g);color:#fff}
.opt.no{background:var(--red);border-color:var(--red);color:#fff}
.qw{font-size:1.8rem;font-weight:800;text-align:center;margin:8px 0;word-break:break-word}
.qa{font-size:1.25rem;font-weight:700;text-align:center;margin:8px 0;color:var(--g)}
.type{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:1.15rem;direction:ltr}
.fb{border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:600}
.fb.ok{background:var(--gs);color:var(--gt)}.fb.no{background:var(--rs);color:var(--red)}
.lbl{font-weight:700;margin:12px 2px 6px;font-size:.95rem}
/* more */
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 4px}
.menu .mi:last-child{border-bottom:0}
.menu .mi .em{width:40px;height:40px;border-radius:12px;background:var(--gs);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.menu .mi span{display:block;color:var(--mut);font-size:.82rem}
.menu .mi .ch{margin-inline-start:auto;color:var(--mut)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fld:last-child{border-bottom:0}
.fld select,.fld input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:220px}
.note{color:var(--mut);font-size:.85rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:#aab3bd}
.dot.ok{background:var(--g)}.dot.wait{background:#e0a23a}.dot.err{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:middle}
td.en{font-weight:600;text-align:left;font-size:.85rem}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--g);font-weight:700;padding:6px 0;margin-bottom:6px}
ul.tips{margin:6px 0;padding-inline-start:20px}ul.tips li{margin:4px 0}
/* nav */
nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(16,30,50,.06)}
nav.bn .in{max-width:720px;margin:0 auto;display:flex}
nav.bn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--mut);padding:6px 0;min-height:52px;position:relative}
nav.bn button svg{width:23px;height:23px}
nav.bn button.on{color:var(--g);font-weight:700}
nav.bn button.on::before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:3px;background:var(--g)}
nav.bn .nb{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);background:var(--red);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;line-height:1.5}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;z-index:60;font-size:.9rem;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
@media(min-width:700px){.cats{grid-template-columns:repeat(3,1fr)}main{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <div class="hrow"><svg class="logo" viewBox="0 0 120 120" role="img" aria-label="FinSpeak"><rect x="2" y="2" width="116" height="116" rx="27" fill="#0d4a57" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/><rect x="44" y="18" width="32" height="50" rx="16" fill="#ffffff"/><path d="M51 34h18M51 43h18M51 52h18" stroke="#0d4a57" stroke-width="3.5" stroke-linecap="round"/><path d="M33 54a27 27 0 0 0 54 0" fill="none" stroke="#b07a10" stroke-width="6" stroke-linecap="round"/><path d="M60 81v13M47 96h26" stroke="#b07a10" stroke-width="6" stroke-linecap="round"/></svg><div><div class="hi" id="hi"></div><div class="hd" id="hd"></div></div><span class="pill" id="pill">🔥 0</span></div>
  <label class="sbox"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="ابحث عن مصطلح بالإنجليزي أو بالعربي…" autocomplete="off" enterkeyhint="search"></label>
</div></header>
<main class="wrap" id="view"></main>
<nav class="bn"><div class="in" id="nav">
  <button data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button data-go="dict"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>القاموس</button>
  <button data-go="study"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>مذاكرة<span class="nb" id="nbStudy" hidden></span></button>
  <button data-go="quiz"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 12 3 3 5-6"/></svg>اختبار</button>
  <button data-go="more"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>المزيد</button>
</div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const CATS=["أساسيات المحاسبة","القوائم المالية وعناصرها","معايير ومعالجات محاسبية","المراجعة","الضرائب","التمويل والتحليل المالي","🦈 ريادة الأعمال (شارك تانك)","💼 إنجليزي الشركات والانترفيو"];
const D=[{"e":"Accounting","a":"المحاسبة","x":"نظام لتسجيل وتبويب وتلخيص العمليات المالية للمنشأة وعرضها في تقارير تفيد متخذي القرار.","s":"Accounting is the language of business.","t":"المحاسبة هي لغة الأعمال.","c":0,"ka":"9bbd45bad55c","ks":"7881a4f67b06","b":0},{"e":"Bookkeeping","a":"مسك الدفاتر","x":"التسجيل اليومي للعمليات في الدفاتر، وهو الجزء التنفيذي من المحاسبة.","s":"Good bookkeeping makes the audit much easier.","t":"مسك الدفاتر الجيد بيسهّل المراجعة جدًا.","c":0,"ka":"b4ce435600f0","ks":"f643682f117e","b":0},{"e":"Double entry","a":"القيد المزدوج","x":"كل عملية ليها طرف مدين وطرف دائن بنفس القيمة، وده أساس توازن الدفاتر.","s":"Double entry requires that total debits equal total credits.","t":"القيد المزدوج يتطلب تساوي إجمالي المدين مع إجمالي الدائن.","c":0,"ka":"4e23ea8f263a","ks":"a9286f4e9354","b":0},{"e":"Debit","a":"مدين","x":"الطرف الأيسر في القيد؛ بيزوّد الأصول والمصروفات وبيقلل الالتزامات وحقوق الملكية والإيرادات.","s":"We debit the expense account and credit cash.","t":"بنجعل حساب المصروف مدينًا والنقدية دائنة.","c":0,"h":"دِبِت (حرف b مش بيتنطق تقيل)","ka":"009534719f8c","ks":"90acb63ad8c5","b":0},{"e":"Credit","a":"دائن","x":"الطرف الأيمن في القيد؛ بيزوّد الالتزامات وحقوق الملكية والإيرادات وبيقلل الأصول والمصروفات.","s":"The sale was recorded as a credit to revenue.","t":"تم تسجيل البيع كطرف دائن في الإيرادات.","c":0,"ka":"0a90b1bc4078","ks":"26fba1236515","b":0},{"e":"Journal entry","a":"قيد اليومية","x":"تسجيل العملية في دفتر اليومية بطرفيها المدين والدائن مع شرح مختصر.","s":"The accountant posted a journal entry to correct the error.","t":"المحاسب سجّل قيد يومية لتصحيح الخطأ.","c":0,"h":"جِرنَل إنتري","ka":"112baac2126a","ks":"8e1e11cd2f09","b":0},{"e":"General ledger","a":"دفتر الأستاذ العام","x":"الدفتر اللي بتترحّل له كل القيود وبيظهر فيه رصيد كل حساب.","s":"Every journal entry is posted to the general ledger.","t":"كل قيد يومية بيترحّل لدفتر الأستاذ العام.","c":0,"h":"جِنرَل لِدچَر","ka":"7f06fe547977","ks":"e0c04f69b2e1","b":0},{"e":"Subsidiary ledger","a":"دفتر الأستاذ المساعد","x":"دفتر تفصيلي لحساب إجمالي، زي أستاذ مساعد العملاء أو الموردين.","s":"The subsidiary ledger must agree with the control account.","t":"الأستاذ المساعد لازم يطابق الحساب الإجمالي.","c":0,"h":"سَبسيديَري","ka":"b24e7a1e5214","ks":"e6fccccf0c42","b":0},{"e":"Trial balance","a":"ميزان المراجعة","x":"كشف بأرصدة كل الحسابات في تاريخ معين للتأكد من توازن المدين والدائن، وهو نقطة البداية لإعداد القوائم.","s":"We obtained the trial balance as of 31 December.","t":"حصلنا على ميزان المراجعة في 31 ديسمبر.","c":0,"h":"ترايَل بالَنس","ka":"28c7ce04a4df","ks":"e604ae618688","b":0},{"e":"Chart of accounts","a":"دليل الحسابات","x":"قائمة منظمة بكل حسابات الشركة وأكوادها.","s":"The chart of accounts should match the company's activities.","t":"دليل الحسابات لازم يناسب أنشطة الشركة.","c":0,"ka":"82f0c414f7a3","ks":"9ce107d3ab96","b":0},{"e":"Posting","a":"الترحيل","x":"نقل القيود من اليومية إلى حسابات الأستاذ.","s":"Posting to the ledger is done automatically by the system.","t":"الترحيل للأستاذ بيتم آليًا عن طريق النظام.","c":0,"ka":"d348b20ad541","ks":"8b6f5ca31b4a","b":0},{"e":"Accrual basis","a":"أساس الاستحقاق","x":"تسجيل الإيراد عند اكتسابه والمصروف عند تحمّله، بغض النظر عن وقت القبض أو الدفع.","s":"Financial statements are prepared on the accrual basis.","t":"القوائم المالية بتتعد على أساس الاستحقاق.","c":0,"h":"أَكرُووَل","ka":"40a264840ac9","ks":"5b8e600c24c8","b":0},{"e":"Cash basis","a":"الأساس النقدي","x":"تسجيل الإيراد والمصروف فقط عند القبض أو الدفع الفعلي.","s":"Small entities sometimes use the cash basis.","t":"المنشآت الصغيرة أحيانًا بتستخدم الأساس النقدي.","c":0,"ka":"15347325bf5f","ks":"e565df9ae3ba","b":0},{"e":"Going concern","a":"الاستمرارية","x":"افتراض إن المنشأة هتستمر في نشاطها في المستقبل المنظور ومش ناوية أو مضطرة للتصفية.","s":"Management assessed the company's ability to continue as a going concern.","t":"الإدارة قيّمت قدرة الشركة على الاستمرار.","c":0,"h":"جووِنج كونسِرن","ka":"2fa668aa0e36","ks":"b161a9b0a28a","b":0},{"e":"Materiality","a":"الأهمية النسبية","x":"المعلومة تعتبر مهمة لو حذفها أو تحريفها ممكن يأثر على قرارات مستخدمي القوائم.","s":"The error is below materiality, so no adjustment is required.","t":"الخطأ أقل من الأهمية النسبية فمفيش تسوية مطلوبة.","c":0,"h":"مَتيريالِتي","ka":"b27d23913faa","ks":"6483420d28e1","b":0},{"e":"Consistency","a":"الثبات","x":"استخدام نفس السياسات المحاسبية من فترة لفترة علشان القوائم تكون قابلة للمقارنة.","s":"Consistency allows users to compare results over time.","t":"الثبات بيسمح للمستخدمين بمقارنة النتائج عبر الزمن.","c":0,"ka":"8e2cf96ea22e","ks":"271f58667c25","b":0},{"e":"Prudence","a":"الحيطة والحذر","x":"الحذر عند التقدير في ظروف عدم التأكد، بحيث الأصول والإيرادات ماتتضخمش والالتزامات والمصروفات ماتتقللش.","s":"Prudence means exercising caution when making estimates.","t":"الحيطة معناها ممارسة الحذر عند عمل التقديرات.","c":0,"h":"برودِنس","ka":"d1266baad531","ks":"821025026575","b":0},{"e":"Matching principle","a":"مبدأ المقابلة","x":"مقابلة المصروفات بالإيرادات اللي ساهمت في تحقيقها في نفس الفترة.","s":"Under the matching principle, cost of sales is recognised with the related revenue.","t":"طبقًا لمبدأ المقابلة، تكلفة المبيعات بتتسجل مع الإيراد المرتبط بيها.","c":0,"ka":"88112bd2ee5f","ks":"adff26e5bd3f","b":0},{"e":"Substance over form","a":"الجوهر فوق الشكل","x":"المحاسبة عن العملية حسب حقيقتها الاقتصادية مش شكلها القانوني.","s":"The lease was treated according to substance over form.","t":"عقد الإيجار اتعالج طبقًا للجوهر مش الشكل.","c":0,"h":"سَبستَنس","ka":"cd170432a528","ks":"1ec258d42a71","b":0},{"e":"Historical cost","a":"التكلفة التاريخية","x":"قياس الأصل بالمبلغ المدفوع فيه وقت الاقتناء.","s":"Land is carried at historical cost.","t":"الأرض مثبتة بالتكلفة التاريخية.","c":0,"ka":"74e1bbd482a2","ks":"541d9d9ac6e5","b":0},{"e":"Fair value","a":"القيمة العادلة","x":"السعر اللي ممكن يتباع بيه أصل أو يتحوّل بيه التزام في معاملة منتظمة بين مشاركين في السوق في تاريخ القياس.","s":"The investment is measured at fair value through profit or loss.","t":"الاستثمار بيتقاس بالقيمة العادلة من خلال الأرباح أو الخسائر.","c":0,"ka":"a01fbcd20996","ks":"d5f14287497c","b":0},{"e":"Recognition","a":"الاعتراف","x":"إدراج بند في القوائم المالية لما يستوفي التعريف وشروط الإثبات.","s":"Revenue recognition depends on the transfer of control.","t":"الاعتراف بالإيراد بيعتمد على انتقال السيطرة.","c":0,"h":"رِكُجنِشَن","ka":"a0da8eddc9c0","ks":"37c1cd8df7ab","b":0},{"e":"Derecognition","a":"الاستبعاد من الدفاتر","x":"حذف أصل أو التزام سبق إثباته من قائمة المركز المالي.","s":"Derecognition of the asset resulted in a gain.","t":"استبعاد الأصل نتج عنه ربح.","c":0,"h":"دي رِكُجنِشَن","ka":"0553b76354fb","ks":"f06d7ac985e3","b":0},{"e":"Measurement","a":"القياس","x":"تحديد المبلغ اللي هيظهر بيه البند في القوائم المالية.","s":"Subsequent measurement is at amortised cost.","t":"القياس اللاحق بيكون بالتكلفة المستهلكة.","c":0,"h":"مِچَرمِنت","ka":"911842b19d8b","ks":"431caec69f1c","b":0},{"e":"Disclosure","a":"الإفصاح","x":"المعلومات التوضيحية اللي بتتعرض في الإيضاحات المتممة للقوائم.","s":"The disclosure of related party transactions is incomplete.","t":"الإفصاح عن معاملات الأطراف ذات العلاقة غير مكتمل.","c":0,"h":"دِسكلوچَر","ka":"cffcb1a185b2","ks":"50cc212b5cf6","b":0},{"e":"Accounting policy","a":"السياسة المحاسبية","x":"المبادئ والقواعد اللي بتطبقها المنشأة في إعداد وعرض قوائمها.","s":"A change in accounting policy is applied retrospectively.","t":"التغيير في السياسة المحاسبية بيتطبق بأثر رجعي.","c":0,"ka":"56693c3c1ab6","ks":"bf62639cf06b","b":0},{"e":"Accounting estimate","a":"التقدير المحاسبي","x":"مبلغ نقدي في القوائم خاضع لعدم تأكد في القياس، زي العمر الإنتاجي أو مخصص الخسائر.","s":"A change in an accounting estimate is applied prospectively.","t":"التغيير في التقدير المحاسبي بيتطبق بأثر مستقبلي.","c":0,"h":"إستِمِت","ka":"3507c531bd17","ks":"6141292a79a7","b":0},{"e":"Retrospective application","a":"التطبيق بأثر رجعي","x":"تطبيق السياسة الجديدة كأنها كانت مطبقة من الأول مع تعديل أرقام المقارنة.","s":"Retrospective application requires restating comparatives.","t":"التطبيق بأثر رجعي يتطلب إعادة عرض أرقام المقارنة.","c":0,"h":"رِتروسبِكتِڤ","ka":"ffe44458e486","ks":"e115a09fbab5","b":0},{"e":"Prospective application","a":"التطبيق بأثر مستقبلي","x":"تطبيق التغيير على الفترة الحالية والفترات الجاية بس.","s":"The new useful life is accounted for by prospective application.","t":"العمر الإنتاجي الجديد بيتعالج بأثر مستقبلي.","c":0,"ka":"f7ea8fba3811","ks":"cb11a15b842f","b":0},{"e":"Prior period error","a":"خطأ فترة سابقة","x":"حذف أو تحريف في قوائم فترات سابقة نتيجة عدم استخدام معلومات كانت متاحة.","s":"A material prior period error is corrected by restatement.","t":"خطأ الفترة السابقة الهام بيتصحح بإعادة العرض.","c":0,"ka":"d1ffd044a273","ks":"31153ebfce00","b":0},{"e":"Restatement","a":"إعادة العرض / التعديل","x":"تعديل أرقام سبق نشرها لتصحيح خطأ أو لتطبيق سياسة بأثر رجعي.","s":"The comparatives were restated to correct the error.","t":"أرقام المقارنة اتعدلت لتصحيح الخطأ.","c":0,"ka":"d0e4fb68da75","ks":"8b7fd6196369","b":0},{"e":"Reclassification","a":"إعادة التبويب","x":"نقل مبلغ من بند لبند تاني في العرض بدون تأثير على الربح.","s":"We proposed a reclassification from current to non-current.","t":"اقترحنا إعادة تبويب من متداول لغير متداول.","c":0,"ka":"4dee4b5a30c1","ks":"2999ed762924","b":0},{"e":"Comparative figures","a":"أرقام المقارنة","x":"أرقام الفترة السابقة المعروضة جنب أرقام الفترة الحالية.","s":"Comparative figures must be presented for all amounts.","t":"أرقام المقارنة لازم تتعرض لكل المبالغ.","c":0,"h":"كُمبارَتِڤ","ka":"fee4d777b794","ks":"f3633f8f7b69","b":0},{"e":"Reporting period","a":"الفترة المالية","x":"المدة اللي بتغطيها القوائم المالية، غالبًا سنة.","s":"The reporting period ends on 31 December.","t":"الفترة المالية بتنتهي في 31 ديسمبر.","c":0,"ka":"9a919d90da43","ks":"1f9abc8e0692","b":0},{"e":"Fiscal year","a":"السنة المالية","x":"فترة 12 شهر بتستخدمها الشركة لأغراض التقارير والضرائب.","s":"The company's fiscal year starts on 1 July.","t":"السنة المالية للشركة بتبدأ 1 يوليو.","c":0,"ka":"57addb64bc78","ks":"eee7776dc12d","b":0},{"e":"Adjusting entry","a":"قيد التسوية","x":"قيد في نهاية الفترة لتطبيق الاستحقاق، زي المستحقات والمقدمات والإهلاك.","s":"Adjusting entries are recorded before closing the books.","t":"قيود التسوية بتتسجل قبل إقفال الدفاتر.","c":0,"ka":"3cc49f8c7e67","ks":"2314be1f04a1","b":0},{"e":"Closing entry","a":"قيد الإقفال","x":"قيد بيقفل حسابات الإيرادات والمصروفات في الأرباح المرحلة آخر السنة.","s":"Closing entries transfer net profit to retained earnings.","t":"قيود الإقفال بتنقل صافي الربح للأرباح المرحلة.","c":0,"ka":"61ede373d1e1","ks":"431cd93e9586","b":0},{"e":"Reversing entry","a":"القيد العكسي","x":"قيد في بداية الفترة بيعكس قيد تسوية اتعمل في نهاية الفترة السابقة.","s":"The accrual was cleared by a reversing entry in January.","t":"المستحق اتقفل بقيد عكسي في يناير.","c":0,"ka":"06dbb560ce0c","ks":"03b6af7e7556","b":0},{"e":"Reconciliation","a":"المطابقة / التسوية","x":"مقارنة رصيدين من مصدرين مختلفين وتفسير الفروق بينهم.","s":"The bank reconciliation shows two outstanding cheques.","t":"مذكرة تسوية البنك فيها شيكين معلقين.","c":0,"h":"رِكَنسيلييشَن","ka":"5ebcfd4f7b7c","ks":"bf4ec9ba805f","b":0},{"e":"Balance","a":"الرصيد","x":"الفرق بين مجموع المدين ومجموع الدائن في الحساب.","s":"The closing balance agrees with the ledger.","t":"الرصيد الختامي مطابق للأستاذ.","c":0,"ka":"99a808d8d161","ks":"4d139be69429","b":0},{"e":"Opening balance","a":"الرصيد الافتتاحي","x":"رصيد الحساب في بداية الفترة، وهو نفسه رصيد آخر الفترة السابقة.","s":"Opening balances were agreed to last year's audited figures.","t":"الأرصدة الافتتاحية اتطابقت مع أرقام السنة السابقة المراجعة.","c":0,"ka":"2318b9a3418d","ks":"03090f6382d4","b":1},{"e":"Carrying amount","a":"القيمة الدفترية","x":"المبلغ اللي الأصل أو الالتزام ظاهر بيه في المركز المالي بعد خصم مجمع الإهلاك والاضمحلال.","s":"The carrying amount exceeds the recoverable amount.","t":"القيمة الدفترية أكبر من القيمة الاستردادية.","c":0,"ka":"37d1f261e794","ks":"4df903ab6b1c","b":1},{"e":"Accrued expenses","a":"مصروفات مستحقة","x":"مصروفات تخص الفترة ولسه مادفعتش، بتظهر كالتزام.","s":"Accrued expenses include unpaid salaries for December.","t":"المصروفات المستحقة تشمل مرتبات ديسمبر غير المدفوعة.","c":0,"h":"أَكرُود","ka":"dc1a80423b99","ks":"21719ea7cdeb","b":1},{"e":"Prepaid expenses","a":"مصروفات مدفوعة مقدمًا","x":"مبالغ اتدفعت عن فترات جاية، بتظهر كأصل لحد ما تُستنفد.","s":"Prepaid expenses include insurance paid in advance.","t":"المصروفات المقدمة تشمل تأمين مدفوع مقدمًا.","c":0,"ka":"d1332044f038","ks":"cf5d34fb3cc7","b":1},{"e":"Accrued revenue","a":"إيرادات مستحقة","x":"إيراد تم اكتسابه ولسه ماتحصلش أو ماتفوترش.","s":"Accrued revenue was recognised for services performed in December.","t":"تم الاعتراف بإيراد مستحق عن خدمات اتأدت في ديسمبر.","c":0,"ka":"f581936004b0","ks":"dac3fce7b0c9","b":1},{"e":"Deferred revenue","a":"إيرادات مؤجلة","x":"مبالغ اتحصلت مقدمًا عن سلع أو خدمات لسه ماتقدمتش، بتظهر كالتزام.","s":"Advance payments from customers are recorded as deferred revenue.","t":"الدفعات المقدمة من العملاء بتتسجل كإيرادات مؤجلة.","c":0,"h":"دِفِرد","ka":"87ad630eaac6","ks":"cde895dd8baa","b":1},{"e":"Suspense account","a":"حساب معلّق","x":"حساب مؤقت للمبالغ اللي طبيعتها لسه مش معروفة؛ لازم يتصفّى قبل الإقفال.","s":"The suspense account must be cleared before year end.","t":"الحساب المعلق لازم يتصفى قبل نهاية السنة.","c":0,"ka":"25bb14f3d499","ks":"9774214daf8d","b":1},{"e":"Control account","a":"حساب المراقبة الإجمالي","x":"حساب إجمالي في الأستاذ العام بيمثل مجموع أرصدة الأستاذ المساعد.","s":"The receivables control account agrees with the customer listing.","t":"حساب العملاء الإجمالي مطابق لكشف العملاء.","c":0,"ka":"ee96a8b778b7","ks":"738acd5cfc4a","b":1},{"e":"Write-off","a":"الإعدام / الشطب","x":"حذف رصيد أصل من الدفاتر لأنه بقى مالوش قيمة أو غير قابل للتحصيل.","s":"The board approved the write-off of the bad debt.","t":"مجلس الإدارة وافق على إعدام الدين.","c":0,"ka":"5e45302b9fea","ks":"d944c5584d72","b":1},{"e":"Write-down","a":"تخفيض القيمة","x":"تخفيض جزئي للقيمة الدفترية لأصل، زي تخفيض المخزون لصافي القيمة البيعية.","s":"A write-down of inventory was recorded for slow-moving items.","t":"تم تسجيل تخفيض للمخزون عن الأصناف الراكدة.","c":0,"ka":"bd3e7d1f6a97","ks":"09e979ebb6c2","b":1},{"e":"Offsetting","a":"المقاصة","x":"عرض أصل والتزام بالصافي؛ غير مسموح إلا لو معيار بيطلبه أو بيسمح بيه.","s":"Offsetting of assets and liabilities is generally not permitted.","t":"المقاصة بين الأصول والالتزامات غير مسموحة بشكل عام.","c":0,"ka":"d57acf2c159f","ks":"f80e9a0e82b0","b":1},{"e":"Financial statements","a":"القوائم المالية","x":"مجموعة كاملة: المركز المالي، الدخل، الدخل الشامل، التغير في حقوق الملكية، التدفقات النقدية، والإيضاحات.","s":"The financial statements were approved by the board of directors.","t":"القوائم المالية اعتمدها مجلس الإدارة.","c":1,"ka":"5f839a30fb06","ks":"72a080c37e18","b":1},{"e":"Statement of financial position","a":"قائمة المركز المالي","x":"بتعرض أصول والتزامات وحقوق ملكية المنشأة في تاريخ معين (الميزانية).","s":"Total assets in the statement of financial position increased by ten percent.","t":"إجمالي الأصول في قائمة المركز المالي زاد 10%.","c":1,"ka":"9146c91ed50a","ks":"ad054e44783f","b":1},{"e":"Statement of profit or loss","a":"قائمة الأرباح أو الخسائر","x":"بتعرض الإيرادات والمصروفات وصافي الربح أو الخسارة عن الفترة (قائمة الدخل).","s":"The statement of profit or loss shows a net profit for the year.","t":"قائمة الأرباح أو الخسائر بتظهر صافي ربح عن السنة.","c":1,"ka":"0e02fa062646","ks":"3232f053e275","b":1},{"e":"Other comprehensive income","a":"الدخل الشامل الآخر","x":"بنود دخل ومصروف مش بتتسجل في الأرباح أو الخسائر، زي فروق تقييم بعض الاستثمارات وفروق ترجمة العمليات الأجنبية.","s":"The revaluation gain is recognised in other comprehensive income.","t":"ربح إعادة التقييم بيتسجل في الدخل الشامل الآخر.","c":1,"h":"كُمبريهِنسِڤ","ka":"9782d946b086","ks":"f9acfb18d020","b":1},{"e":"Statement of changes in equity","a":"قائمة التغير في حقوق الملكية","x":"بتعرض حركة كل بند من حقوق الملكية خلال الفترة.","s":"Dividends appear in the statement of changes in equity.","t":"التوزيعات بتظهر في قائمة التغير في حقوق الملكية.","c":1,"h":"إكوِتي","ka":"e54dc49e7649","ks":"8af879134b31","b":1},{"e":"Statement of cash flows","a":"قائمة التدفقات النقدية","x":"بتعرض المقبوضات والمدفوعات النقدية مبوبة لأنشطة تشغيل واستثمار وتمويل.","s":"The statement of cash flows was prepared using the indirect method.","t":"قائمة التدفقات النقدية اتعدت بالطريقة غير المباشرة.","c":1,"ka":"8f3406833cba","ks":"4078ba09f38a","b":1},{"e":"Notes to the financial statements","a":"الإيضاحات المتممة للقوائم المالية","x":"السياسات المحاسبية والتفاصيل والإفصاحات المكملة للأرقام.","s":"The notes to the financial statements form an integral part of them.","t":"الإيضاحات جزء لا يتجزأ من القوائم المالية.","c":1,"ka":"aee208066f1b","ks":"ed86bb981532","b":1},{"e":"Asset","a":"أصل","x":"مورد اقتصادي حالي تسيطر عليه المنشأة نتيجة أحداث سابقة.","s":"Cash is the most liquid asset.","t":"النقدية هي أكتر الأصول سيولة.","c":1,"ka":"26e9054be7f4","ks":"d54ef602fe8f","b":1},{"e":"Liability","a":"التزام","x":"تعهد حالي على المنشأة بتحويل مورد اقتصادي نتيجة أحداث سابقة.","s":"A liability is recognised when the obligation arises.","t":"الالتزام بيتسجل لما التعهد ينشأ.","c":1,"h":"لايَبِلِتي","ka":"b87b86a85c19","ks":"b27e08b5006b","b":1},{"e":"Equity","a":"حقوق الملكية","x":"الحق المتبقي في أصول المنشأة بعد خصم كل التزاماتها.","s":"Equity equals total assets minus total liabilities.","t":"حقوق الملكية = إجمالي الأصول ناقص إجمالي الالتزامات.","c":1,"h":"إكوِتي","ka":"d9df82520372","ks":"6a9234377f35","b":1},{"e":"Revenue","a":"الإيراد","x":"الدخل الناتج من النشاط العادي للمنشأة، زي بيع السلع وتقديم الخدمات.","s":"Revenue increased due to higher sales volume.","t":"الإيراد زاد بسبب ارتفاع حجم المبيعات.","c":1,"h":"رِڤِنيو","ka":"54358a914f51","ks":"e28f6cba7050","b":1},{"e":"Expense","a":"مصروف","x":"نقص في الأصول أو زيادة في الالتزامات بينتج عنه نقص في حقوق الملكية غير التوزيعات على الملاك.","s":"Depreciation is a non-cash expense.","t":"الإهلاك مصروف غير نقدي.","c":1,"ka":"7bf48cb93997","ks":"1ec3c4e3b96a","b":1},{"e":"Current assets","a":"الأصول المتداولة","x":"أصول متوقع تحصيلها أو بيعها أو استخدامها خلال 12 شهر أو دورة التشغيل العادية.","s":"Current assets include cash, receivables and inventory.","t":"الأصول المتداولة تشمل النقدية والعملاء والمخزون.","c":1,"ka":"02a2d9626bc9","ks":"a073de93ac56","b":1},{"e":"Non-current assets","a":"الأصول غير المتداولة","x":"أصول طويلة الأجل زي الأصول الثابتة والاستثمارات طويلة الأجل.","s":"Non-current assets are tested for impairment when indicators exist.","t":"الأصول غير المتداولة بتُختبر للاضمحلال عند وجود مؤشرات.","c":1,"ka":"e0e7adf7fdc7","ks":"8288736fb789","b":1},{"e":"Current liabilities","a":"الالتزامات المتداولة","x":"التزامات مستحقة السداد خلال 12 شهر من تاريخ المركز المالي.","s":"The overdraft is classified under current liabilities.","t":"السحب على المكشوف مبوب ضمن الالتزامات المتداولة.","c":1,"ka":"1b513e5b9141","ks":"762f70847ac5","b":1},{"e":"Working capital","a":"رأس المال العامل","x":"الأصول المتداولة ناقص الالتزامات المتداولة؛ مؤشر على السيولة قصيرة الأجل.","s":"Negative working capital may indicate liquidity problems.","t":"رأس المال العامل السالب ممكن يدل على مشاكل سيولة.","c":1,"ka":"6b3eb7b148c3","ks":"a4c09aa401b3","b":1},{"e":"Cash and cash equivalents","a":"النقدية وما في حكمها","x":"النقدية بالخزينة والبنوك واستثمارات قصيرة الأجل عالية السيولة (عادة 3 شهور أو أقل).","s":"Treasury bills maturing within three months are cash equivalents.","t":"أذون الخزانة اللي بتستحق خلال 3 شهور تعتبر في حكم النقدية.","c":1,"h":"إكوِيڤَلَنتس","ka":"15403c788ee9","ks":"e20750810c2d","b":1},{"e":"Petty cash","a":"العهدة النقدية / النثرية","x":"مبلغ صغير بالخزينة للمصروفات اليومية البسيطة.","s":"We counted the petty cash on the first day of the visit.","t":"جردنا العهدة النقدية في أول يوم زيارة.","c":1,"ka":"a9eb19cb039c","ks":"87c39b45a839","b":1},{"e":"Bank overdraft","a":"سحب على المكشوف","x":"رصيد دائن للبنك نتيجة سحب أكتر من المتاح في الحساب.","s":"The bank overdraft is secured by a mortgage.","t":"السحب على المكشوف مضمون برهن.","c":1,"ka":"e69b1dae694b","ks":"b7e70185412f","b":1},{"e":"Trade receivables","a":"العملاء / المدينون التجاريون","x":"مبالغ مستحقة على العملاء عن بيع آجل.","s":"Trade receivables are stated net of expected credit losses.","t":"العملاء معروضين بالصافي بعد الخسائر الائتمانية المتوقعة.","c":1,"h":"رِسيڤَبِلز","ka":"c8deb488f95a","ks":"ea37f314b305","b":1},{"e":"Notes receivable","a":"أوراق القبض","x":"شيكات وكمبيالات مستحقة للشركة على الغير.","s":"Notes receivable due after one year are non-current.","t":"أوراق القبض المستحقة بعد سنة غير متداولة.","c":1,"ka":"1fa2764e47af","ks":"a4b32b148e31","b":1},{"e":"Trade payables","a":"الموردون / الدائنون التجاريون","x":"مبالغ مستحقة للموردين عن مشتريات آجلة.","s":"Trade payables were confirmed directly with suppliers.","t":"أرصدة الموردين اتأكدت بمصادقات مباشرة.","c":1,"h":"پايَبِلز","ka":"954a55dcdcd1","ks":"701f9f0376b9","b":1},{"e":"Inventory","a":"المخزون","x":"بضاعة بغرض البيع، أو تحت التشغيل، أو خامات ومستلزمات إنتاج.","s":"Inventory is measured at the lower of cost and net realisable value.","t":"المخزون بيتقاس بالتكلفة أو صافي القيمة البيعية أيهما أقل.","c":1,"h":"إنڤِنتوري","ka":"4d604dd8f008","ks":"5b34a426350e","b":1},{"e":"Raw materials","a":"المواد الخام","x":"الخامات اللي بتدخل في التصنيع.","s":"Raw materials are valued using the weighted average method.","t":"الخامات بتتقيّم بطريقة المتوسط المرجح.","c":1,"ka":"b5189cc55d59","ks":"e79feaaf27e9","b":1},{"e":"Work in progress","a":"إنتاج تحت التشغيل","x":"منتجات بدأ تصنيعها ولسه ماكملتش.","s":"Work in progress includes direct materials, labour and overheads.","t":"الإنتاج تحت التشغيل يشمل الخامات والأجور والتكاليف غير المباشرة.","c":1,"ka":"e2e7f476e093","ks":"f6c758a0ea44","b":1},{"e":"Finished goods","a":"إنتاج تام","x":"منتجات كمل تصنيعها وجاهزة للبيع.","s":"Finished goods are stored in the main warehouse.","t":"الإنتاج التام مخزّن في المخزن الرئيسي.","c":1,"ka":"6fdb14b5fe34","ks":"ebe937e8aefe","b":1},{"e":"Net realisable value","a":"صافي القيمة البيعية (الاستردادية)","x":"سعر البيع التقديري ناقص تكاليف الإتمام والبيع.","s":"Damaged items were written down to net realisable value.","t":"الأصناف التالفة اتخفضت لصافي القيمة البيعية.","c":1,"h":"رييَلايزَبُل","ka":"d0feabed1b97","ks":"f914d8b6530a","b":1},{"e":"Weighted average cost","a":"متوسط التكلفة المرجح","x":"طريقة تسعير للمخزون بتقسم إجمالي التكلفة على إجمالي الكمية.","s":"The company applies weighted average cost to all inventories.","t":"الشركة بتطبق المتوسط المرجح على كل المخزون.","c":1,"ka":"b8ac0b26f9cb","ks":"196dff33633c","b":1},{"e":"Cost of sales","a":"تكلفة المبيعات","x":"تكلفة البضاعة أو الخدمات اللي اتباعت خلال الفترة.","s":"Cost of sales rose faster than revenue.","t":"تكلفة المبيعات زادت أسرع من الإيراد.","c":1,"ka":"feb736cfbed0","ks":"6d87ba411b29","b":1},{"e":"Gross profit","a":"مجمل الربح","x":"الإيراد ناقص تكلفة المبيعات.","s":"Gross profit margin declined from thirty to twenty-five percent.","t":"هامش مجمل الربح انخفض من 30% إلى 25%.","c":1,"ka":"0ae03b9d8106","ks":"bce4c48f22bc","b":2},{"e":"Operating profit","a":"ربح التشغيل","x":"الربح من النشاط الأساسي قبل التمويل والضرائب.","s":"Operating profit excludes finance costs and income tax.","t":"ربح التشغيل لا يشمل تكاليف التمويل وضريبة الدخل.","c":1,"ka":"dbbad42dcf19","ks":"8d3b2f460cec","b":2},{"e":"Net profit","a":"صافي الربح","x":"الربح بعد خصم كل المصروفات والضرائب.","s":"Net profit for the year was transferred to retained earnings.","t":"صافي ربح السنة اترحّل للأرباح المرحلة.","c":1,"ka":"9e7909831562","ks":"d82db6932eb7","b":2},{"e":"Administrative expenses","a":"المصروفات الإدارية والعمومية","x":"مصروفات الإدارة العامة غير المرتبطة مباشرة بالإنتاج أو البيع.","s":"Administrative expenses include head office salaries and rent.","t":"المصروفات الإدارية تشمل مرتبات وإيجار المركز الرئيسي.","c":1,"h":"أدمِنِسترَتِڤ","ka":"e6d1eb5caf96","ks":"996b3b309d98","b":2},{"e":"Selling and distribution expenses","a":"مصروفات البيع والتوزيع","x":"مصروفات التسويق والبيع وتوصيل البضاعة للعملاء.","s":"Selling and distribution expenses include sales commissions.","t":"مصروفات البيع والتوزيع تشمل عمولات البيع.","c":1,"ka":"fd3c70bd6802","ks":"b7671499983d","b":2},{"e":"Finance costs","a":"تكاليف التمويل","x":"الفوائد والمصروفات التمويلية على القروض والتسهيلات.","s":"Finance costs increased because of higher interest rates.","t":"تكاليف التمويل زادت بسبب ارتفاع أسعار الفائدة.","c":1,"ka":"d45bc21a883a","ks":"f5e436ac2049","b":2},{"e":"Share capital","a":"رأس المال","x":"قيمة الأسهم المصدرة للمساهمين.","s":"The share capital is fully paid.","t":"رأس المال مدفوع بالكامل.","c":1,"ka":"b3ea8825fe37","ks":"305cd083482d","b":2},{"e":"Issued capital","a":"رأس المال المصدر","x":"الجزء من رأس المال المرخص به اللي الشركة أصدرت بيه أسهم فعلًا.","s":"Issued capital amounts to ten million pounds.","t":"رأس المال المصدر 10 مليون جنيه.","c":1,"h":"إيشُود","ka":"478758595c21","ks":"4615daab6b2a","b":2},{"e":"Authorised capital","a":"رأس المال المرخص به","x":"الحد الأقصى لرأس المال المسموح للشركة تصدره حسب نظامها الأساسي.","s":"The authorised capital is stated in the articles of association.","t":"رأس المال المرخص به مذكور في النظام الأساسي.","c":1,"h":"أوثَرايزد","ka":"46e1c34da23c","ks":"3de51440f0c3","b":2},{"e":"Paid-in capital","a":"رأس المال المدفوع","x":"المبلغ اللي المساهمين دفعوه فعلًا من رأس المال المصدر.","s":"Paid-in capital was verified against bank certificates.","t":"رأس المال المدفوع اتحقق منه بالشهادات البنكية.","c":1,"ka":"75bd53a5c263","ks":"8463771976d6","b":2},{"e":"Retained earnings","a":"الأرباح المرحلة (المحتجزة)","x":"أرباح سنوات سابقة ماتوزعتش واتحجزت داخل الشركة.","s":"Retained earnings decreased after the dividend distribution.","t":"الأرباح المرحلة قلت بعد التوزيعات.","c":1,"ka":"fa32412e7e9a","ks":"bc938df0bf79","b":2},{"e":"Legal reserve","a":"الاحتياطي القانوني","x":"نسبة من صافي الربح بتتجنب سنويًا طبقًا لقانون الشركات والنظام الأساسي.","s":"Five percent of net profit is transferred to the legal reserve.","t":"5% من صافي الربح بتتحول للاحتياطي القانوني.","c":1,"ka":"0446be8cd426","ks":"888e1ee3336f","b":2},{"e":"Dividends","a":"توزيعات الأرباح","x":"الجزء من الأرباح اللي بيتوزع على المساهمين بقرار الجمعية العامة.","s":"Dividends are recognised when approved by the general assembly.","t":"التوزيعات بتتسجل عند اعتماد الجمعية العامة.","c":1,"h":"دِڤِدِندز","ka":"0a9a83483944","ks":"d6db393d4758","b":2},{"e":"Treasury shares","a":"أسهم الخزينة","x":"أسهم الشركة اللي اشترتها من السوق، وبتتعرض مخصومة من حقوق الملكية.","s":"Treasury shares are deducted from equity.","t":"أسهم الخزينة بتتخصم من حقوق الملكية.","c":1,"h":"تريچَري","ka":"f12ff805935a","ks":"a34604a2c1cb","b":2},{"e":"Share premium","a":"علاوة الإصدار","x":"الزيادة في سعر إصدار السهم عن قيمته الاسمية.","s":"The share premium was credited to a special reserve.","t":"علاوة الإصدار اتضافت لاحتياطي خاص.","c":1,"h":"پريميَم","ka":"5868fe774776","ks":"e25de682e7c0","b":2},{"e":"Earnings per share","a":"نصيب السهم في الأرباح","x":"صافي الربح المتاح لحملة الأسهم العادية مقسوم على المتوسط المرجح لعدد الأسهم.","s":"Earnings per share must be presented on the face of the income statement.","t":"نصيب السهم في الأرباح لازم يتعرض في صلب قائمة الدخل.","c":1,"ka":"ce154025e28d","ks":"5abcdaa609e8","b":2},{"e":"Operating activities","a":"أنشطة التشغيل","x":"الأنشطة الرئيسية المولدة للإيراد في قائمة التدفقات النقدية.","s":"Cash flows from operating activities were negative this year.","t":"التدفقات النقدية من أنشطة التشغيل كانت سالبة السنة دي.","c":1,"ka":"dbd375428b23","ks":"99952ed8c3fa","b":2},{"e":"Investing activities","a":"أنشطة الاستثمار","x":"شراء وبيع الأصول طويلة الأجل والاستثمارات.","s":"Purchase of machinery is shown under investing activities.","t":"شراء الآلات بيظهر ضمن أنشطة الاستثمار.","c":1,"ka":"933adf4629e7","ks":"d4603f3951bd","b":2},{"e":"Financing activities","a":"أنشطة التمويل","x":"العمليات اللي بتغيّر حجم ومكونات حقوق الملكية والقروض.","s":"Loan repayments are classified as financing activities.","t":"سداد القروض بيتبوب كأنشطة تمويل.","c":1,"ka":"de3749c50f97","ks":"b14c1acce806","b":2},{"e":"Property, plant and equipment","a":"الأصول الثابتة (العقارات والآلات والمعدات)","x":"أصول ملموسة بتستخدم في الإنتاج أو الإدارة لأكتر من فترة مالية.","s":"Property, plant and equipment is stated at cost less accumulated depreciation.","t":"الأصول الثابتة معروضة بالتكلفة ناقص مجمع الإهلاك.","c":2,"ka":"d2e95da434da","ks":"6d73a7a8c269","b":2},{"e":"Depreciation","a":"الإهلاك","x":"توزيع منتظم للقيمة القابلة للإهلاك للأصل الثابت على عمره الإنتاجي.","s":"Depreciation is calculated using the straight-line method.","t":"الإهلاك بيتحسب بطريقة القسط الثابت.","c":2,"h":"دِپريشييشَن","ka":"3c86e097bc77","ks":"d6ceabab93cb","b":2},{"e":"Accumulated depreciation","a":"مجمع الإهلاك","x":"إجمالي الإهلاك المحمّل على الأصل من تاريخ استخدامه.","s":"Accumulated depreciation is deducted from the cost of the asset.","t":"مجمع الإهلاك بيتخصم من تكلفة الأصل.","c":2,"h":"أكيوميولَيتِد","ka":"85a81ee28fbd","ks":"e0f7191336b4","b":2},{"e":"Amortisation","a":"الاستهلاك","x":"توزيع تكلفة الأصل غير الملموس على عمره الإنتاجي.","s":"Amortisation of software is charged over five years.","t":"استهلاك البرامج بيتحمّل على 5 سنين.","c":2,"h":"أمورتايزَيشَن","ka":"9ba759bf9605","ks":"e682e0300d60","b":2},{"e":"Useful life","a":"العمر الإنتاجي","x":"المدة المتوقع إن المنشأة تستخدم فيها الأصل.","s":"Management reviews the useful life of assets annually.","t":"الإدارة بتراجع العمر الإنتاجي للأصول سنويًا.","c":2,"ka":"1ad7f693ed5c","ks":"b5700952773c","b":2},{"e":"Residual value","a":"القيمة التخريدية (المتبقية)","x":"المبلغ المتوقع الحصول عليه من بيع الأصل في نهاية عمره بعد خصم تكاليف البيع.","s":"The residual value of the vehicles is estimated at ten percent.","t":"القيمة التخريدية للسيارات مقدّرة بـ10%.","c":2,"h":"رِزِديوَل","ka":"af72ab3a0df2","ks":"879d89ccd303","b":2},{"e":"Straight-line method","a":"طريقة القسط الثابت","x":"تحميل مبلغ إهلاك متساوي كل سنة.","s":"The straight-line method gives an equal charge each year.","t":"طريقة القسط الثابت بتدي عبء متساوي كل سنة.","c":2,"ka":"693292c2e119","ks":"18c27450f3ed","b":2},{"e":"Reducing balance method","a":"طريقة القسط المتناقص","x":"تحميل إهلاك أعلى في السنوات الأولى بتطبيق نسبة ثابتة على القيمة الدفترية.","s":"The reducing balance method front-loads the depreciation.","t":"القسط المتناقص بيحمّل إهلاك أكبر في البداية.","c":2,"ka":"17a1015116e2","ks":"85515ce3530d","b":2},{"e":"Capital expenditure","a":"إنفاق رأسمالي","x":"مصروف بيزوّد أصل أو عمره أو طاقته، وبيترسمل على الأصل.","s":"The overhaul was treated as capital expenditure.","t":"العَمرة اتعالجت كإنفاق رأسمالي.","c":2,"h":"إكسپِندِتشَر","ka":"b7667830bcc5","ks":"aa7d1cede92b","b":2},{"e":"Capitalisation","a":"الرسملة","x":"إضافة التكلفة على الأصل بدل تحميلها كمصروف.","s":"Capitalisation of borrowing costs stops when the asset is ready for use.","t":"رسملة تكاليف الاقتراض بتقف لما الأصل يبقى جاهز للاستخدام.","c":2,"ka":"b776c1712aec","ks":"fdb6d5397c95","b":2},{"e":"Projects under construction","a":"مشروعات تحت التنفيذ","x":"تكاليف أصول ثابتة لسه بتتبني أو بتتركب ولم تُستخدم بعد، ومابتتهلكش.","s":"Projects under construction are transferred to fixed assets on completion.","t":"المشروعات تحت التنفيذ بتتحول للأصول الثابتة عند الانتهاء.","c":2,"ka":"18717e4e177f","ks":"1b398695f27a","b":2},{"e":"Disposal","a":"الاستبعاد / البيع","x":"بيع الأصل أو التخلص منه واستبعاده من الدفاتر.","s":"The gain on disposal of the vehicle was recognised in profit or loss.","t":"ربح بيع السيارة اتسجل في الأرباح أو الخسائر.","c":2,"ka":"45205658881b","ks":"356d18d195f3","b":2},{"e":"Revaluation","a":"إعادة التقييم","x":"قياس الأصل بقيمته العادلة بعد الإثبات الأولي.","s":"The revaluation surplus is shown within equity.","t":"فائض إعادة التقييم بيظهر ضمن حقوق الملكية.","c":2,"ka":"8b3afe8b7077","ks":"5e3bf7a57b07","b":2},{"e":"Impairment","a":"الاضمحلال","x":"انخفاض القيمة الاستردادية للأصل عن قيمته الدفترية.","s":"An impairment loss was recognised on the production line.","t":"تم تسجيل خسارة اضمحلال على خط الإنتاج.","c":2,"h":"إمپَيرمِنت","ka":"b038c84e8199","ks":"22665a1b01e4","b":2},{"e":"Recoverable amount","a":"القيمة الاستردادية","x":"القيمة العادلة ناقص تكاليف البيع أو القيمة الاستخدامية، أيهما أعلى.","s":"The recoverable amount was determined based on value in use.","t":"القيمة الاستردادية اتحددت على أساس القيمة الاستخدامية.","c":2,"ka":"b9879ff9542e","ks":"4418a3125b7a","b":2},{"e":"Value in use","a":"القيمة الاستخدامية","x":"القيمة الحالية للتدفقات النقدية المتوقعة من الأصل.","s":"Value in use requires discounting future cash flows.","t":"القيمة الاستخدامية تتطلب خصم التدفقات النقدية المستقبلية.","c":2,"ka":"9952a07f5570","ks":"ea3ee38b0ed2","b":2},{"e":"Cash-generating unit","a":"وحدة توليد النقد","x":"أصغر مجموعة أصول بتولّد تدفقات نقدية مستقلة.","s":"Goodwill is allocated to each cash-generating unit.","t":"الشهرة بتتوزع على كل وحدة توليد نقد.","c":2,"ka":"df0560e951e9","ks":"2ca173888050","b":2},{"e":"Intangible assets","a":"الأصول غير الملموسة","x":"أصول غير نقدية مالهاش وجود مادي وقابلة للتحديد، زي البرامج والتراخيص.","s":"Intangible assets include software licences.","t":"الأصول غير الملموسة تشمل تراخيص البرامج.","c":2,"h":"إنتانچِبُل","ka":"f9487bdafd86","ks":"208f984cc640","b":2},{"e":"Goodwill","a":"الشهرة","x":"زيادة مقابل الاقتناء عن القيمة العادلة لصافي أصول الشركة المقتناة.","s":"Goodwill is tested for impairment annually.","t":"الشهرة بتُختبر للاضمحلال سنويًا.","c":2,"ka":"6463c5e7d6fe","ks":"52d38ab73bf6","b":2},{"e":"Investment property","a":"الاستثمار العقاري","x":"عقار محتفظ بيه للتأجير أو لارتفاع قيمته مش للاستخدام في النشاط.","s":"The building is leased out and classified as investment property.","t":"المبنى مؤجّر ومبوّب كاستثمار عقاري.","c":2,"ka":"601d1d5f479a","ks":"596984db506b","b":2},{"e":"Borrowing costs","a":"تكاليف الاقتراض","x":"الفوائد والتكاليف التانية المرتبطة باقتراض الأموال.","s":"Borrowing costs on qualifying assets are capitalised.","t":"تكاليف الاقتراض على الأصول المؤهلة بتترسمل.","c":2,"ka":"201c7f4f2ad6","ks":"5e04f7d61d8c","b":2},{"e":"Lease","a":"عقد التأجير","x":"عقد بينقل حق استخدام أصل لمدة محددة مقابل عوض.","s":"The lease term is five years with an option to extend.","t":"مدة العقد 5 سنين مع خيار التمديد.","c":2,"ka":"47c96b084b21","ks":"333ecfd84b49","b":3},{"e":"Lessee","a":"المستأجر","x":"الطرف اللي بيحصل على حق استخدام الأصل.","s":"The lessee recognises a right-of-use asset and a lease liability.","t":"المستأجر بيثبت أصل حق انتفاع والتزام تأجير.","c":2,"h":"لِسّي","ka":"c561c92f4d15","ks":"6e2a806cde62","b":3},{"e":"Lessor","a":"المؤجر","x":"الطرف اللي بيمنح حق استخدام الأصل.","s":"The lessor classifies each lease as finance or operating.","t":"المؤجر بيبوّب كل عقد كتمويلي أو تشغيلي.","c":2,"h":"لِسّور","ka":"0ae5ef3b1dfe","ks":"95b8b299349c","b":3},{"e":"Right-of-use asset","a":"أصل حق الانتفاع","x":"أصل بيمثل حق المستأجر في استخدام الأصل المؤجر خلال مدة العقد.","s":"The right-of-use asset is depreciated over the lease term.","t":"أصل حق الانتفاع بيتهلك على مدة العقد.","c":2,"ka":"edfde07b3f57","ks":"63d55217ce38","b":3},{"e":"Lease liability","a":"التزام عقد التأجير","x":"القيمة الحالية لدفعات الإيجار غير المسددة.","s":"The lease liability is measured at the present value of lease payments.","t":"التزام التأجير بيتقاس بالقيمة الحالية لدفعات الإيجار.","c":2,"ka":"ab749172e6a0","ks":"a0626bcae224","b":3},{"e":"Finance lease","a":"تأجير تمويلي","x":"عقد بينقل بشكل جوهري مخاطر ومنافع ملكية الأصل للمستأجر.","s":"The company's main activity is finance lease.","t":"النشاط الرئيسي للشركة هو التأجير التمويلي.","c":2,"ka":"7d833640bbb1","ks":"3c7cb7d1049a","b":3},{"e":"Sale and leaseback","a":"البيع مع إعادة الاستئجار","x":"بيع أصل ثم إعادة استئجاره من المشتري.","s":"The sale and leaseback did not qualify as a sale.","t":"عملية البيع مع إعادة الاستئجار لم تستوفِ شروط البيع.","c":2,"ka":"2a88ea4dd0e8","ks":"333c8fe40c42","b":3},{"e":"Performance obligation","a":"التزام الأداء","x":"تعهد في العقد بتحويل سلعة أو خدمة مميزة للعميل.","s":"Revenue is recognised when the performance obligation is satisfied.","t":"الإيراد بيتسجل عند الوفاء بالتزام الأداء.","c":2,"h":"أوبلِجيشَن","ka":"aa30a2a75879","ks":"2fc9cd81bbc4","b":3},{"e":"Transaction price","a":"سعر المعاملة","x":"مبلغ المقابل اللي المنشأة متوقعة تستحقه مقابل السلع أو الخدمات.","s":"The transaction price is allocated to each performance obligation.","t":"سعر المعاملة بيتوزع على كل التزام أداء.","c":2,"ka":"da8429156db1","ks":"7879c45c1b4b","b":3},{"e":"Contract asset","a":"أصل العقد","x":"حق المنشأة في مقابل عن أعمال اتنفذت ولسه مش مستحق غير مشروط (لسه ماتفوترش).","s":"Unbilled work is presented as a contract asset.","t":"الأعمال غير المفوترة بتتعرض كأصل عقد.","c":2,"ka":"14d50f803547","ks":"80986f8371ab","b":3},{"e":"Contract liability","a":"التزام العقد","x":"التزام بتحويل سلع أو خدمات لعميل دفع مقابلها مقدمًا.","s":"Advances from customers are presented as contract liabilities.","t":"الدفعات المقدمة من العملاء بتتعرض كالتزامات عقود.","c":2,"ka":"3c62dbd3b9d1","ks":"385ac703b706","b":3},{"e":"Percentage of completion","a":"نسبة الإتمام","x":"قياس التقدم في تنفيذ العقد للاعتراف بالإيراد على مدار الزمن، شائعة في المقاولات.","s":"Revenue is recognised based on the percentage of completion.","t":"الإيراد بيتسجل على أساس نسبة الإتمام.","c":2,"ka":"4516b3e2c155","ks":"d00657c450c5","b":3},{"e":"Variable consideration","a":"المقابل المتغير","x":"جزء من سعر المعاملة ممكن يتغير بسبب خصومات أو حوافز أو غرامات.","s":"Volume rebates are a form of variable consideration.","t":"خصومات الكمية نوع من المقابل المتغير.","c":2,"ka":"efdecf2d665b","ks":"a4dff916cb24","b":3},{"e":"Retention","a":"ضمان الأعمال / المحتجزات","x":"نسبة بيحتجزها العميل من المستخلصات لحد انتهاء فترة الضمان، شائعة في المقاولات.","s":"Retention receivables are collected after the final handover.","t":"محتجزات ضمان الأعمال بتتحصل بعد الاستلام النهائي.","c":2,"ka":"7f6d38d7d0f6","ks":"c21bc8225c8d","b":3},{"e":"Provision","a":"مخصص","x":"التزام غير مؤكد التوقيت أو المبلغ.","s":"A provision is recognised when an outflow of resources is probable.","t":"المخصص بيتسجل لما يكون خروج الموارد مرجح.","c":2,"h":"پروڤِچَن","ka":"a7e4aefd145e","ks":"6129f67f4704","b":3},{"e":"Contingent liability","a":"التزام محتمل","x":"التزام ممكن يتوقف على أحداث مستقبلية غير مؤكدة؛ بيُفصح عنه ولا يُثبت.","s":"The lawsuit is disclosed as a contingent liability.","t":"الدعوى القضائية مفصح عنها كالتزام محتمل.","c":2,"h":"كُنتِنچِنت","ka":"cdf6071e8376","ks":"d7385e5dca69","b":3},{"e":"Contingent asset","a":"أصل محتمل","x":"أصل ممكن ينشأ من أحداث سابقة ووجوده متوقف على أحداث مستقبلية غير مؤكدة.","s":"A contingent asset is disclosed only when an inflow is probable.","t":"الأصل المحتمل بيُفصح عنه بس لما التدفق الداخل يكون مرجح.","c":2,"ka":"dc0604083193","ks":"3c2e27623dae","b":3},{"e":"Onerous contract","a":"عقد محمّل بخسارة","x":"عقد تكاليف تنفيذه الحتمية أكبر من منافعه المتوقعة.","s":"A provision was made for the onerous contract.","t":"تم تكوين مخصص للعقد المحمّل بخسارة.","c":2,"h":"أُونَرَس","ka":"31f007718568","ks":"09a7394e46b7","b":3},{"e":"Financial instrument","a":"أداة مالية","x":"عقد بينشئ أصل مالي لطرف والتزام مالي أو أداة ملكية لطرف تاني.","s":"A loan is a financial instrument for both parties.","t":"القرض أداة مالية للطرفين.","c":2,"ka":"45c39c5bda34","ks":"e137f5b9922d","b":3},{"e":"Financial asset","a":"أصل مالي","x":"نقدية، أو حق تعاقدي في استلام نقدية، أو أداة ملكية في منشأة أخرى.","s":"Trade receivables are financial assets measured at amortised cost.","t":"العملاء أصول مالية بتتقاس بالتكلفة المستهلكة.","c":2,"ka":"8e0cb622b8f0","ks":"c6122c6c72bd","b":3},{"e":"Amortised cost","a":"التكلفة المستهلكة","x":"قياس الأداة المالية بمبلغ الإثبات الأولي ناقص السداد ومعدّل بالفائدة الفعلية والاضمحلال.","s":"The bonds are held to collect and measured at amortised cost.","t":"السندات محتفظ بيها للتحصيل وبتتقاس بالتكلفة المستهلكة.","c":2,"ka":"de487ce0022d","ks":"e04987356cf2","b":3},{"e":"Effective interest rate","a":"سعر الفائدة الفعلي","x":"السعر اللي بيخصم التدفقات النقدية المتوقعة للأداة لصافي قيمتها الدفترية.","s":"Interest income is calculated using the effective interest rate.","t":"إيراد الفوائد بيتحسب بسعر الفائدة الفعلي.","c":2,"ka":"20477cdcbe05","ks":"d0a01c6005f0","b":3},{"e":"Expected credit loss","a":"الخسائر الائتمانية المتوقعة","x":"متوسط مرجح بالاحتمالات لخسائر الائتمان، وهو أساس مخصص اضمحلال الأصول المالية.","s":"The expected credit loss model is forward-looking.","t":"نموذج الخسائر الائتمانية المتوقعة بيبص للمستقبل.","c":2,"ka":"e0dcd3740dc2","ks":"9cae7f174a84","b":3},{"e":"Probability of default","a":"احتمال التعثر","x":"احتمال إن المدين مايسددش خلال فترة معينة.","s":"Probability of default increases for overdue customers.","t":"احتمال التعثر بيزيد للعملاء المتأخرين.","c":2,"h":"ديفولت","ka":"624cb1dc39d8","ks":"64f9a179c40a","b":3},{"e":"Loss given default","a":"الخسارة عند التعثر","x":"نسبة الخسارة من الرصيد لو حصل تعثر، بعد أخذ الضمانات في الاعتبار.","s":"Collateral reduces the loss given default.","t":"الضمانات بتقلل الخسارة عند التعثر.","c":2,"ka":"58c9973644c4","ks":"dbe52a8f7c6e","b":3},{"e":"Exposure at default","a":"الرصيد المعرّض عند التعثر","x":"المبلغ المتوقع يكون مستحق على المدين وقت التعثر.","s":"Exposure at default includes undrawn commitments.","t":"الرصيد المعرض عند التعثر يشمل الارتباطات غير المسحوبة.","c":2,"h":"إكسپوچَر","ka":"a132536723c2","ks":"7b71e8c49974","b":3},{"e":"Significant increase in credit risk","a":"زيادة جوهرية في مخاطر الائتمان","x":"المعيار اللي بينقل الأصل المالي من المرحلة الأولى للمرحلة التانية (خسائر على مدى العمر).","s":"A delay of more than thirty days indicates a significant increase in credit risk.","t":"التأخير أكتر من 30 يوم بيدل على زيادة جوهرية في مخاطر الائتمان.","c":2,"ka":"7501770a7b3c","ks":"28e98622beda","b":3},{"e":"Business model","a":"نموذج الأعمال","x":"طريقة إدارة المنشأة لأصولها المالية (تحصيل، تحصيل وبيع، متاجرة)، وبيحدد التبويب.","s":"Classification depends on the business model and cash flow characteristics.","t":"التبويب بيعتمد على نموذج الأعمال وخصائص التدفقات النقدية.","c":2,"ka":"093889c6b078","ks":"0656b35fb227","b":3},{"e":"Hedge accounting","a":"محاسبة التغطية","x":"معالجة بتربط أثر أداة التغطية بالبند المغطى في نفس الفترة.","s":"Hedge accounting requires formal documentation.","t":"محاسبة التغطية تتطلب توثيق رسمي.","c":2,"h":"هِدچ","ka":"bca875a3a8a4","ks":"f938f687e314","b":3},{"e":"Derivative","a":"مشتقة مالية","x":"أداة قيمتها بتتغير تبعًا لمتغير أساسي زي سعر فائدة أو عملة.","s":"A forward contract is a derivative.","t":"العقد الآجل مشتقة مالية.","c":2,"h":"دِرِڤَتِڤ","ka":"70ae6e285cc1","ks":"a769e08306d2","b":3},{"e":"Subsidiary","a":"شركة تابعة","x":"منشأة تسيطر عليها منشأة أخرى (الشركة الأم).","s":"The parent consolidates all its subsidiaries.","t":"الشركة الأم بتجمّع كل شركاتها التابعة.","c":2,"h":"سَبسيديَري","ka":"18c8282969bf","ks":"d519c64e57d6","b":3},{"e":"Parent company","a":"الشركة الأم (القابضة)","x":"المنشأة اللي بتسيطر على شركة تابعة أو أكتر.","s":"The parent company owns eighty percent of the shares.","t":"الشركة الأم تملك 80% من الأسهم.","c":2,"ka":"232011681a11","ks":"d9a189d34338","b":3},{"e":"Associate","a":"شركة شقيقة","x":"منشأة للمستثمر عليها نفوذ مؤثر من غير سيطرة.","s":"The investment in the associate is accounted for using the equity method.","t":"الاستثمار في الشركة الشقيقة بيتعالج بطريقة حقوق الملكية.","c":2,"h":"أسوشيَت","ka":"758ab9c1162e","ks":"d72d5b0b6868","b":3},{"e":"Joint venture","a":"مشروع مشترك","x":"ترتيب مشترك للأطراف فيه حقوق في صافي أصول الترتيب.","s":"The joint venture is jointly controlled by two partners.","t":"المشروع المشترك تحت سيطرة مشتركة من شريكين.","c":2,"ka":"55f51c25e509","ks":"abfdedfd0d27","b":3},{"e":"Control","a":"السيطرة","x":"سلطة على المنشأة المستثمر فيها، وتعرض لعوائد متغيرة، وقدرة على استخدام السلطة للتأثير على العوائد.","s":"Control exists even with less than half of the voting rights in some cases.","t":"السيطرة ممكن توجد حتى بأقل من نص حقوق التصويت في بعض الحالات.","c":2,"ka":"a1595abbb4c3","ks":"6542f3ae56fa","b":3},{"e":"Significant influence","a":"النفوذ المؤثر","x":"القدرة على المشاركة في قرارات السياسات المالية والتشغيلية بدون سيطرة (يُفترض عند 20% فأكثر).","s":"Holding twenty percent of voting power indicates significant influence.","t":"امتلاك 20% من حقوق التصويت بيدل على نفوذ مؤثر.","c":2,"ka":"7660197a3dd3","ks":"cfd543309493","b":3},{"e":"Consolidated financial statements","a":"القوائم المالية المجمعة","x":"قوائم المجموعة كأنها كيان اقتصادي واحد.","s":"Intragroup balances are eliminated in the consolidated financial statements.","t":"الأرصدة بين شركات المجموعة بتُستبعد في القوائم المجمعة.","c":2,"ka":"ddcec33a8175","ks":"20cbde46d4fa","b":3},{"e":"Separate financial statements","a":"القوائم المالية المستقلة","x":"قوائم الشركة الأم لوحدها اللي بتظهر فيها الاستثمارات بالتكلفة أو بطرق تانية مسموحة.","s":"Investments in subsidiaries are carried at cost in the separate financial statements.","t":"الاستثمارات في التابعة مثبتة بالتكلفة في القوائم المستقلة.","c":2,"ka":"f6073579f607","ks":"ecadbf790ad4","b":3},{"e":"Non-controlling interest","a":"الحقوق غير المسيطرة (حقوق الأقلية)","x":"حقوق الملكية في الشركة التابعة غير المنسوبة للشركة الأم.","s":"Non-controlling interest is presented within equity.","t":"الحقوق غير المسيطرة بتتعرض ضمن حقوق الملكية.","c":2,"ka":"059f423036bb","ks":"77c1a7c0d691","b":3},{"e":"Equity method","a":"طريقة حقوق الملكية","x":"إثبات الاستثمار بالتكلفة وتعديله بنصيب المستثمر في أرباح وخسائر الشركة المستثمر فيها.","s":"Under the equity method, dividends reduce the carrying amount.","t":"في طريقة حقوق الملكية، التوزيعات بتخفض القيمة الدفترية.","c":2,"ka":"dd1d59d258b5","ks":"ae9c65036406","b":3},{"e":"Business combination","a":"تجميع الأعمال","x":"عملية بيحصل فيها المقتني على السيطرة على نشاط أو أكتر.","s":"The business combination was accounted for using the acquisition method.","t":"تجميع الأعمال اتعالج بطريقة الاقتناء.","c":2,"ka":"fbb334840fb3","ks":"fe0f4bbc0618","b":4},{"e":"Elimination","a":"الاستبعاد","x":"حذف المعاملات والأرصدة المتبادلة بين شركات المجموعة عند التجميع.","s":"Elimination entries remove intragroup sales.","t":"قيود الاستبعاد بتشيل المبيعات بين شركات المجموعة.","c":2,"ka":"37ce2a997288","ks":"beab4ef8ede2","b":4},{"e":"Functional currency","a":"عملة التعامل","x":"عملة البيئة الاقتصادية الأساسية اللي المنشأة بتشتغل فيها.","s":"The functional currency of the company is the Egyptian pound.","t":"عملة التعامل للشركة هي الجنيه المصري.","c":2,"ka":"181e05340971","ks":"fea73bc2b785","b":4},{"e":"Presentation currency","a":"عملة العرض","x":"العملة اللي القوائم المالية بتتعرض بيها.","s":"The group's presentation currency is the US dollar.","t":"عملة العرض للمجموعة هي الدولار الأمريكي.","c":2,"ka":"3fc1ced6e189","ks":"208e4705c746","b":4},{"e":"Foreign exchange differences","a":"فروق العملة","x":"أرباح أو خسائر ناتجة من تغير سعر الصرف بين تاريخ المعاملة وتاريخ السداد أو التقييم.","s":"Foreign exchange differences are recognised in profit or loss.","t":"فروق العملة بتتسجل في الأرباح أو الخسائر.","c":2,"ka":"7ae1d9a3b22d","ks":"a3aa90a97472","b":4},{"e":"Monetary items","a":"البنود ذات الطبيعة النقدية","x":"نقدية وأصول والتزامات هتتحصل أو تتسدد بمبالغ نقدية محددة؛ بتترجم بسعر الإقفال.","s":"Monetary items are translated at the closing rate.","t":"البنود النقدية بتترجم بسعر الإقفال.","c":2,"h":"مَنِتَري","ka":"d39bdd0a24f7","ks":"dc3dd9d271e3","b":4},{"e":"Deferred tax","a":"الضريبة المؤجلة","x":"ضريبة مستحقة أو مستردة في المستقبل نتيجة فروق مؤقتة بين القيمة الدفترية والأساس الضريبي.","s":"Deferred tax arises from temporary differences.","t":"الضريبة المؤجلة بتنشأ من الفروق المؤقتة.","c":2,"ka":"aabb171e0a3c","ks":"d8f3baba8e2b","b":4},{"e":"Temporary difference","a":"فرق مؤقت","x":"فرق بين القيمة الدفترية للأصل أو الالتزام وأساسه الضريبي.","s":"Different depreciation rates create a temporary difference.","t":"اختلاف معدلات الإهلاك بيعمل فرق مؤقت.","c":2,"ka":"eadb882ac119","ks":"e763a102139c","b":4},{"e":"Tax base","a":"الأساس الضريبي","x":"المبلغ المنسوب للأصل أو الالتزام لأغراض الضريبة.","s":"The tax base of the asset is lower than its carrying amount.","t":"الأساس الضريبي للأصل أقل من قيمته الدفترية.","c":2,"ka":"bb5d3a34a869","ks":"3eac8be386b4","b":4},{"e":"Related party","a":"طرف ذو علاقة","x":"شخص أو منشأة مرتبطة بالمنشأة المعدّة للقوائم، زي الشركة الأم والإدارة العليا.","s":"Related party transactions must be disclosed in the notes.","t":"معاملات الأطراف ذات العلاقة لازم يُفصح عنها في الإيضاحات.","c":2,"ka":"e3701d2b89cc","ks":"25b7118f5a45","b":4},{"e":"Key management personnel","a":"أفراد الإدارة العليا","x":"الأشخاص اللي ليهم سلطة ومسؤولية التخطيط والتوجيه والرقابة على أنشطة المنشأة.","s":"Compensation of key management personnel is disclosed.","t":"مزايا أفراد الإدارة العليا مفصح عنها.","c":2,"h":"پِرسونِل","ka":"8948bc0aa516","ks":"25df22b35561","b":4},{"e":"Subsequent events","a":"الأحداث اللاحقة","x":"أحداث بتحصل بين تاريخ المركز المالي وتاريخ اعتماد القوائم للإصدار.","s":"Subsequent events may require adjustment or disclosure.","t":"الأحداث اللاحقة ممكن تتطلب تعديل أو إفصاح.","c":2,"h":"سَبسِكوِنت","ka":"ffb58b734e81","ks":"6f10e226b11e","b":4},{"e":"Operating segment","a":"قطاع تشغيلي","x":"جزء من المنشأة ليه إيرادات ومصروفات ونتايجه بيراجعها متخذ القرار التشغيلي.","s":"Each operating segment is reported separately.","t":"كل قطاع تشغيلي بيتعرض بشكل منفصل.","c":2,"ka":"73eaa00017ea","ks":"e9cda21bd0ae","b":4},{"e":"Employee benefits","a":"مزايا العاملين","x":"كل أشكال المقابل اللي المنشأة بتقدمه مقابل خدمة العاملين.","s":"Employee benefits include salaries and end-of-service payments.","t":"مزايا العاملين تشمل المرتبات ومكافأة نهاية الخدمة.","c":2,"ka":"0698007d7580","ks":"e514c3c47e69","b":4},{"e":"Defined benefit plan","a":"نظام المزايا المحددة","x":"نظام معاش المنشأة فيه بتلتزم بمزايا محددة وبتتحمل المخاطر الاكتوارية.","s":"A defined benefit plan requires actuarial valuation.","t":"نظام المزايا المحددة يتطلب تقييم اكتواري.","c":2,"ka":"345227833063","ks":"381f2084aa29","b":4},{"e":"Present value","a":"القيمة الحالية","x":"قيمة مبلغ مستقبلي النهارده بعد خصمه بمعدل خصم مناسب.","s":"The liability is measured at the present value of future payments.","t":"الالتزام بيتقاس بالقيمة الحالية للمدفوعات المستقبلية.","c":2,"ka":"aae04ecc648e","ks":"86004b2d9565","b":4},{"e":"Discount rate","a":"معدل الخصم","x":"المعدل المستخدم لتحويل تدفقات مستقبلية لقيمتها الحالية.","s":"A higher discount rate reduces the present value.","t":"معدل الخصم الأعلى بيقلل القيمة الحالية.","c":2,"ka":"9e57c2dbcace","ks":"300ad7c050ec","b":4},{"e":"Non-current assets held for sale","a":"أصول غير متداولة محتفظ بها بغرض البيع","x":"أصول هتُسترد قيمتها أساسًا بالبيع مش بالاستخدام، وبتتوقف عن الإهلاك.","s":"The factory was classified as non-current assets held for sale.","t":"المصنع اتبوّب كأصول محتفظ بها بغرض البيع.","c":2,"ka":"6861ad706b11","ks":"126f0fc1c599","b":4},{"e":"Discontinued operation","a":"عملية غير مستمرة","x":"جزء رئيسي من النشاط تم التخلص منه أو مبوب للبيع، وبتتعرض نتايجه منفصلة.","s":"The results of the discontinued operation are shown separately.","t":"نتائج العملية غير المستمرة بتتعرض منفصلة.","c":2,"ka":"72dac231e468","ks":"74a025821177","b":4},{"e":"Audit","a":"المراجعة","x":"فحص مستقل للقوائم المالية بهدف إبداء رأي عن مدى عرضها العادل طبقًا لإطار التقارير المالية.","s":"The audit was conducted in accordance with Egyptian Standards on Auditing.","t":"المراجعة تمت طبقًا لمعايير المراجعة المصرية.","c":3,"h":"أودِت","ka":"eda63b570db8","ks":"f0b6ecb93416","b":4},{"e":"Auditor","a":"مراقب الحسابات / المراجع","x":"الشخص أو المكتب المسؤول عن إبداء الرأي على القوائم المالية.","s":"The auditor must remain independent of the client.","t":"المراجع لازم يفضل مستقل عن العميل.","c":3,"ka":"83088ecc77b5","ks":"508f249c80d2","b":4},{"e":"External audit","a":"المراجعة الخارجية","x":"مراجعة بيقوم بيها مراجع مستقل من خارج الشركة لصالح المساهمين.","s":"External audit provides reasonable assurance to shareholders.","t":"المراجعة الخارجية بتدي تأكيد معقول للمساهمين.","c":3,"ka":"6895880c2088","ks":"94bd9df5230d","b":4},{"e":"Internal audit","a":"المراجعة الداخلية","x":"وظيفة داخل الشركة بتقيّم وتحسّن الرقابة وإدارة المخاطر والحوكمة.","s":"Internal audit reports directly to the audit committee.","t":"المراجعة الداخلية بترفع تقاريرها مباشرة للجنة المراجعة.","c":3,"ka":"0e053e400b01","ks":"1bff12ee953e","b":4},{"e":"Audit engagement","a":"مهمة المراجعة","x":"التكليف المتفق عليه بين المراجع والعميل لمراجعة قوائم فترة معينة.","s":"This is our first audit engagement with the client.","t":"دي أول مهمة مراجعة لنا مع العميل.","c":3,"h":"إنجَيچمِنت","ka":"5036bb7dc6b4","ks":"1f2ad7d9fe96","b":4},{"e":"Engagement letter","a":"خطاب الارتباط","x":"خطاب بيحدد نطاق المهمة ومسؤوليات المراجع والإدارة والأتعاب.","s":"The engagement letter was signed before starting the fieldwork.","t":"خطاب الارتباط اتوقّع قبل بدء العمل الميداني.","c":3,"ka":"7fbabd82dc95","ks":"83022f5051bf","b":4},{"e":"Reasonable assurance","a":"تأكيد معقول","x":"مستوى عالي من التأكيد لكنه مش مطلق، وهو اللي بتقدمه المراجعة.","s":"An audit provides reasonable assurance, not absolute assurance.","t":"المراجعة بتدي تأكيد معقول مش مطلق.","c":3,"h":"أشورَنس","ka":"2f9096218395","ks":"4341d8b69ea1","b":4},{"e":"Limited assurance","a":"تأكيد محدود","x":"مستوى تأكيد أقل من المراجعة، بيتقدم في مهام الفحص المحدود.","s":"A review engagement provides only limited assurance.","t":"مهمة الفحص المحدود بتدي تأكيد محدود بس.","c":3,"ka":"5406ef3f6405","ks":"8c33bdc584ea","b":4},{"e":"Review engagement","a":"مهمة فحص محدود","x":"مهمة بتعتمد أساسًا على الاستفسارات والإجراءات التحليلية، زي فحص القوائم الدورية.","s":"We performed a review engagement on the interim financial statements.","t":"عملنا فحص محدود على القوائم المالية الدورية.","c":3,"ka":"7a382c57b2b7","ks":"c9706b073c60","b":4},{"e":"Agreed-upon procedures","a":"إجراءات متفق عليها","x":"مهمة المراجع فيها بينفذ إجراءات محددة ويعرض النتائج الواقعية بدون إبداء تأكيد.","s":"The bank requested an agreed-upon procedures report.","t":"البنك طلب تقرير إجراءات متفق عليها.","c":3,"ka":"86e0581f7a9b","ks":"90067b1edf76","b":4},{"e":"Independence","a":"الاستقلالية","x":"إن المراجع يكون حر من أي مصلحة أو علاقة تأثر على حكمه المهني، ذهنيًا وظاهريًا.","s":"Independence is the cornerstone of the audit profession.","t":"الاستقلالية هي حجر الزاوية في مهنة المراجعة.","c":3,"ka":"3d6237b7105f","ks":"056688489fe3","b":4},{"e":"Professional scepticism","a":"الشك المهني","x":"موقف ذهني متسائل وتقييم نقدي لأدلة المراجعة مع الانتباه لاحتمال التحريف.","s":"The auditor applied professional scepticism to management's estimates.","t":"المراجع طبّق الشك المهني على تقديرات الإدارة.","c":3,"h":"سكِپتِسِزِم","ka":"2736f5940c1d","ks":"613f9679b9e0","b":4},{"e":"Professional judgment","a":"الحكم المهني","x":"تطبيق الخبرة والمعرفة لاتخاذ قرارات مناسبة في ظروف المهمة.","s":"Setting materiality requires professional judgment.","t":"تحديد الأهمية النسبية بيتطلب حكم مهني.","c":3,"h":"چَدچمِنت","ka":"24d0f32f9800","ks":"ad7d061915ea","b":4},{"e":"Due professional care","a":"العناية المهنية الواجبة","x":"أداء العمل بكفاءة واجتهاد طبقًا للمعايير المهنية.","s":"The work was performed with due professional care.","t":"العمل اتأدى بالعناية المهنية الواجبة.","c":3,"ka":"d7af8428d9f8","ks":"eca4052936cd","b":4},{"e":"Audit risk","a":"خطر المراجعة","x":"خطر إن المراجع يبدي رأي غير مناسب والقوائم فيها تحريف هام.","s":"Audit risk is a function of inherent, control and detection risk.","t":"خطر المراجعة دالة في الخطر المتأصل وخطر الرقابة وخطر الاكتشاف.","c":3,"ka":"a30af1696198","ks":"8de046d99229","b":4},{"e":"Inherent risk","a":"الخطر المتأصل (الحتمي)","x":"قابلية البند للتحريف الهام بطبيعته قبل أخذ الرقابة في الاعتبار.","s":"Complex estimates carry a high inherent risk.","t":"التقديرات المعقدة فيها خطر متأصل عالي.","c":3,"h":"إنهِيرِنت","ka":"50ce5295283a","ks":"f8099b94f4c2","b":4},{"e":"Control risk","a":"خطر الرقابة","x":"خطر إن الرقابة الداخلية ماتمنعش أو ماتكتشفش التحريف في الوقت المناسب.","s":"Control risk was assessed as high due to weak segregation of duties.","t":"خطر الرقابة اتقيّم عالي بسبب ضعف الفصل بين المهام.","c":3,"ka":"2e94bffe8753","ks":"7cf6d000f57e","b":4},{"e":"Detection risk","a":"خطر الاكتشاف","x":"خطر إن إجراءات المراجع ماتكتشفش تحريف هام موجود.","s":"More substantive testing lowers detection risk.","t":"زيادة الاختبارات التفصيلية بتقلل خطر الاكتشاف.","c":3,"ka":"8600e1704588","ks":"81cc2cd1065d","b":4},{"e":"Risk of material misstatement","a":"خطر التحريف الهام والمؤثر","x":"خطر إن القوائم تكون محرّفة تحريف هام قبل المراجعة (المتأصل × الرقابة).","s":"We assessed the risk of material misstatement at the assertion level.","t":"قيّمنا خطر التحريف الهام على مستوى التأكيدات.","c":3,"h":"مِسّتَيتمِنت","ka":"4f847f0a4a2e","ks":"d1a111e79a1e","b":4},{"e":"Significant risk","a":"خطر هام","x":"خطر محتاج اهتمام خاص في المراجعة، زي الغش في الإيراد وتجاوز الإدارة للرقابة.","s":"Revenue recognition is presumed to be a significant risk.","t":"الاعتراف بالإيراد يُفترض إنه خطر هام.","c":3,"ka":"a00559959b38","ks":"48edab85aa5a","b":4},{"e":"Misstatement","a":"تحريف","x":"فرق بين المبلغ أو التبويب أو الإفصاح المعروض وبين المطلوب طبقًا لإطار التقارير.","s":"The misstatement was corrected by management.","t":"الإدارة صححت التحريف.","c":3,"ka":"43406fd1e80e","ks":"c27198dca025","b":4},{"e":"Fraud","a":"الغش","x":"فعل متعمد بيستخدم الخداع للحصول على منفعة غير مشروعة.","s":"Fraud is harder to detect than error because it involves concealment.","t":"الغش أصعب في الاكتشاف من الخطأ لأنه فيه إخفاء.","c":3,"h":"فرود","ka":"b130f12d0f2e","ks":"ba57fb84da34","b":5},{"e":"Error","a":"الخطأ","x":"تحريف غير متعمد في القوائم المالية.","s":"The difference was caused by a clerical error.","t":"الفرق كان بسبب خطأ كتابي.","c":3,"ka":"902b0d55fdde","ks":"c4d2b1ab4332","b":5},{"e":"Fraudulent financial reporting","a":"التقارير المالية الاحتيالية","x":"تحريف متعمد في القوائم لخداع المستخدمين، زي تضخيم الإيرادات.","s":"Pressure to meet targets may lead to fraudulent financial reporting.","t":"الضغط لتحقيق المستهدفات ممكن يؤدي لتقارير مالية احتيالية.","c":3,"h":"فرودچُلَنت","ka":"939e5a8d9a28","ks":"771d898fdccb","b":5},{"e":"Misappropriation of assets","a":"اختلاس الأصول","x":"سرقة أو سوء استخدام أصول المنشأة.","s":"Weak cash controls increase the risk of misappropriation of assets.","t":"ضعف الرقابة على النقدية بيزوّد خطر اختلاس الأصول.","c":3,"h":"مِس أپروپريَيشَن","ka":"434e717ebf6e","ks":"a010c356239a","b":5},{"e":"Management override","a":"تجاوز الإدارة للرقابة","x":"قدرة الإدارة على التلاعب في السجلات بتخطي ضوابط الرقابة.","s":"Journal entry testing addresses the risk of management override.","t":"اختبار القيود بيعالج خطر تجاوز الإدارة للرقابة.","c":3,"ka":"2208cdf46dbc","ks":"d6a8aedbb6c5","b":5},{"e":"Performance materiality","a":"الأهمية النسبية للتنفيذ","x":"مبلغ أقل من الأهمية النسبية الكلية بيستخدم في تصميم الإجراءات لتغطية التحريفات غير المكتشفة.","s":"Performance materiality was set at seventy-five percent of overall materiality.","t":"الأهمية النسبية للتنفيذ اتحددت بـ75% من الكلية.","c":3,"ka":"8f732e21bfc0","ks":"30aab09a3cae","b":5},{"e":"Clearly trivial threshold","a":"حد التحريفات التافهة","x":"المبلغ اللي تحته التحريفات مابتتجمعش لأنها ضئيلة بوضوح.","s":"Differences below the clearly trivial threshold are not accumulated.","t":"الفروق الأقل من حد التفاهة مابتتجمعش.","c":3,"h":"تريڤيَل","ka":"c7158b6b9d0c","ks":"ebe70fafa154","b":5},{"e":"Benchmark","a":"أساس القياس","x":"الرقم اللي بتتحسب منه الأهمية النسبية، زي الربح قبل الضريبة أو الإيرادات أو الأصول.","s":"Profit before tax was selected as the benchmark for materiality.","t":"الربح قبل الضريبة اتاختار كأساس للأهمية النسبية.","c":3,"ka":"74575b23d530","ks":"1b52c01843e8","b":5},{"e":"Audit strategy","a":"استراتيجية المراجعة","x":"الخطة العامة اللي بتحدد نطاق وتوقيت واتجاه المراجعة.","s":"The overall audit strategy was approved by the partner.","t":"استراتيجية المراجعة العامة اعتمدها الشريك.","c":3,"ka":"8358689d9779","ks":"2ff76966ae53","b":5},{"e":"Audit plan","a":"خطة المراجعة","x":"تفاصيل طبيعة وتوقيت ومدى الإجراءات اللي هيتم تنفيذها.","s":"The audit plan was updated after the interim visit.","t":"خطة المراجعة اتحدثت بعد الزيارة المرحلية.","c":3,"ka":"2918b17892e6","ks":"fc843864f251","b":5},{"e":"Audit programme","a":"برنامج المراجعة","x":"قائمة تفصيلية بخطوات المراجعة لكل بند.","s":"The audit programme for receivables includes confirmations.","t":"برنامج مراجعة العملاء يشمل المصادقات.","c":3,"ka":"94d42cc67fbc","ks":"45334b09e5ab","b":5},{"e":"Understanding the entity","a":"فهم المنشأة وبيئتها","x":"الحصول على معرفة بنشاط العميل وصناعته ورقابته الداخلية لتحديد المخاطر.","s":"Understanding the entity is the first step in risk assessment.","t":"فهم المنشأة هو أول خطوة في تقييم المخاطر.","c":3,"ka":"43cebdefd4ff","ks":"0345977cca2a","b":5},{"e":"Internal control","a":"الرقابة الداخلية","x":"نظام بتصممه الإدارة لتوفير تأكيد معقول عن سلامة التقارير وكفاءة العمليات والالتزام بالقوانين.","s":"Weak internal control increases the extent of substantive testing.","t":"ضعف الرقابة الداخلية بيزوّد مدى الاختبارات التفصيلية.","c":3,"ka":"5af90d253df9","ks":"f0a9755fd0aa","b":5},{"e":"Control environment","a":"بيئة الرقابة","x":"موقف الإدارة والحوكمة تجاه الرقابة وأهميتها في المنشأة.","s":"The control environment sets the tone at the top.","t":"بيئة الرقابة بتحدد توجّه الإدارة العليا.","c":3,"ka":"27324d1e7271","ks":"73db28d33adf","b":5},{"e":"Control activities","a":"أنشطة الرقابة","x":"السياسات والإجراءات اللي بتضمن تنفيذ توجيهات الإدارة، زي الاعتمادات والمطابقات.","s":"Control activities include authorisation and reconciliation.","t":"أنشطة الرقابة تشمل الاعتماد والمطابقة.","c":3,"ka":"9e7b0665cc09","ks":"80b4a386d662","b":5},{"e":"Segregation of duties","a":"الفصل بين المهام","x":"توزيع الاعتماد والتسجيل وحيازة الأصل على أشخاص مختلفين لتقليل الغش والخطأ.","s":"Segregation of duties is limited in small companies.","t":"الفصل بين المهام محدود في الشركات الصغيرة.","c":3,"h":"سِجرِجَيشَن","ka":"3c7f0b1a2a8f","ks":"9dfa78925d24","b":5},{"e":"Authorisation","a":"الاعتماد / التصريح","x":"موا
