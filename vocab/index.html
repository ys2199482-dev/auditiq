فقة المستوى الإداري المختص على العملية قبل تنفيذها.","s":"Payments above the limit require authorisation by the finance director.","t":"المدفوعات فوق الحد محتاجة اعتماد المدير المالي.","c":3,"ka":"f8928b529074","ks":"065e9e2ea4ce","b":5},{"e":"Walkthrough","a":"اختبار التتبع","x":"تتبع عملية واحدة من أولها لآخرها للتأكد من فهم الدورة ووجود الرقابة.","s":"We performed a walkthrough of the purchases cycle.","t":"عملنا اختبار تتبع لدورة المشتريات.","c":3,"ka":"5044ac1f3915","ks":"d8b79db5718a","b":5},{"e":"Test of controls","a":"اختبار الرقابة (الالتزام)","x":"إجراء لتقييم فعالية تشغيل ضوابط الرقابة خلال الفترة.","s":"Tests of controls are performed when we plan to rely on controls.","t":"اختبارات الرقابة بتتعمل لما نخطط للاعتماد على الرقابة.","c":3,"ka":"b7f8ae3e371a","ks":"e616f784e4fc","b":5},{"e":"Substantive procedures","a":"الإجراءات التفصيلية (التحقق الأساسية)","x":"إجراءات لاكتشاف التحريف الهام على مستوى التأكيدات: اختبارات تفاصيل وإجراءات تحليلية.","s":"Substantive procedures are required for all material balances.","t":"الإجراءات التفصيلية مطلوبة لكل الأرصدة الهامة.","c":3,"h":"سَبستَنتِڤ","ka":"857bac8b6539","ks":"04a8b1ff05df","b":5},{"e":"Test of details","a":"اختبار التفاصيل","x":"فحص مستندات ومعاملات وأرصدة فردية.","s":"We performed tests of details on a sample of invoices.","t":"عملنا اختبارات تفاصيل على عينة فواتير.","c":3,"ka":"0834b0b9ba23","ks":"792fd1764738","b":5},{"e":"Analytical procedures","a":"الإجراءات التحليلية","x":"تقييم المعلومات المالية بدراسة العلاقات المنطقية بين البيانات والتحقيق في التغيرات غير المتوقعة.","s":"Analytical procedures revealed an unusual increase in gross margin.","t":"الإجراءات التحليلية أظهرت زيادة غير عادية في هامش الربح.","c":3,"h":"أنَلِتِكَل","ka":"65e41daa6b3b","ks":"5c465ab697d1","b":5},{"e":"Deficiency in internal control","a":"قصور في الرقابة الداخلية","x":"ضابط رقابي مش موجود أو مش مصمم أو مش شغال بشكل يمنع أو يكتشف التحريف.","s":"A significant deficiency in internal control was reported to those charged with governance.","t":"تم إبلاغ المسؤولين عن الحوكمة بقصور هام في الرقابة الداخلية.","c":3,"h":"دِفِشَنسي","ka":"b0851e1e1b5a","ks":"cc2e2b0a73ba","b":5},{"e":"Management letter","a":"خطاب الإدارة (خطاب الملاحظات)","x":"خطاب من المراجع للإدارة بملاحظات الرقابة الداخلية والتوصيات.","s":"The management letter included five recommendations.","t":"خطاب الإدارة تضمّن خمس توصيات.","c":3,"ka":"af33534aef12","ks":"1924712cbb6f","b":5},{"e":"Those charged with governance","a":"المسؤولون عن الحوكمة","x":"الأشخاص المسؤولين عن الإشراف على التوجه الاستراتيجي والتقارير المالية، زي مجلس الإدارة ولجنة المراجعة.","s":"We communicated the audit findings to those charged with governance.","t":"بلّغنا نتائج المراجعة للمسؤولين عن الحوكمة.","c":3,"h":"جَڤِرنَنس","ka":"645d53b5b13d","ks":"63940e711664","b":5},{"e":"Audit committee","a":"لجنة المراجعة","x":"لجنة من مجلس الإدارة بتشرف على التقارير المالية والمراجعة الداخلية والخارجية.","s":"The audit committee meets quarterly.","t":"لجنة المراجعة بتجتمع كل ربع سنة.","c":3,"ka":"4de241793700","ks":"cc3106d128bb","b":5},{"e":"Assertions","a":"التأكيدات (مزاعم الإدارة)","x":"إقرارات الإدارة الصريحة أو الضمنية المتضمنة في القوائم المالية، وهي أساس تصميم الإجراءات.","s":"Each procedure is linked to one or more assertions.","t":"كل إجراء مرتبط بتأكيد أو أكتر.","c":3,"h":"أسِرشَنز","ka":"c2835ffac5b5","ks":"3cbd57950d0b","b":5},{"e":"Existence","a":"الوجود","x":"إن الأصول والالتزامات المسجلة موجودة فعلًا في تاريخ المركز المالي.","s":"Physical inspection tests the existence of fixed assets.","t":"المعاينة الفعلية بتختبر وجود الأصول الثابتة.","c":3,"ka":"7f1b3a3cd866","ks":"c568bcdebafd","b":5},{"e":"Occurrence","a":"الحدوث","x":"إن المعاملات المسجلة حصلت فعلًا وتخص المنشأة.","s":"We vouched sales to delivery notes to test occurrence.","t":"راجعنا المبيعات على أذون التسليم لاختبار الحدوث.","c":3,"h":"أُكَرَنس","ka":"0d8a9b093d9f","ks":"3f026befbe83","b":5},{"e":"Completeness","a":"الاكتمال","x":"إن كل المعاملات والأرصدة اللي المفروض تتسجل اتسجلت فعلًا.","s":"Tracing from source documents to the ledger tests completeness.","t":"التتبع من المستند للدفتر بيختبر الاكتمال.","c":3,"ka":"16e1f516e65d","ks":"0c0c69cbdb83","b":5},{"e":"Accuracy","a":"الدقة","x":"إن المبالغ والبيانات اتسجلت بشكل صحيح.","s":"We recalculated depreciation to test accuracy.","t":"أعدنا حساب الإهلاك لاختبار الدقة.","c":3,"h":"أَكيورَسي","ka":"d78f1fb7e69f","ks":"a233b8959835","b":5},{"e":"Cut-off","a":"الحد الفاصل","x":"إن المعاملات اتسجلت في الفترة المحاسبية الصحيحة.","s":"We tested sales cut-off around the year end.","t":"اختبرنا الحد الفاصل للمبيعات حوالين نهاية السنة.","c":3,"ka":"6cbd9bb37516","ks":"ece7a578159c","b":5},{"e":"Valuation","a":"التقييم","x":"إن الأصول والالتزامات ظاهرة بمبالغ مناسبة مع أي تسويات تقييم.","s":"The valuation of inventory depends on net realisable value.","t":"تقييم المخزون بيعتمد على صافي القيمة البيعية.","c":3,"ka":"3e6564c044ac","ks":"4300f61a2b93","b":5},{"e":"Rights and obligations","a":"الحقوق والالتزامات","x":"إن المنشأة تملك أو تسيطر على الأصول وإن الالتزامات تخصها.","s":"Title deeds support rights and obligations over land.","t":"عقود الملكية بتؤيد الحقوق والالتزامات على الأرض.","c":3,"ka":"9457ed0a6e8b","ks":"ab3d39e87dc0","b":5},{"e":"Classification","a":"التبويب","x":"إن المعاملات والأرصدة اتسجلت في الحسابات الصحيحة.","s":"We reviewed the classification of loans between current and non-current.","t":"راجعنا تبويب القروض بين متداول وغير متداول.","c":3,"ka":"5c9335b28e62","ks":"ad538577f847","b":5},{"e":"Presentation","a":"العرض","x":"إن البنود معروضة وموصوفة ومفصح عنها بشكل مناسب وواضح.","s":"Presentation and disclosure were checked against the standards.","t":"العرض والإفصاح اتراجعوا على المعايير.","c":3,"ka":"c7bc3fddddb6","ks":"d6b8932e1a43","b":5},{"e":"Audit evidence","a":"أدلة المراجعة","x":"المعلومات اللي المراجع بيبني عليها استنتاجاته ورأيه.","s":"Audit evidence must be sufficient and appropriate.","t":"أدلة المراجعة لازم تكون كافية ومناسبة.","c":3,"ka":"031eaf0d903b","ks":"6541e5487d9b","b":5},{"e":"Sufficient appropriate audit evidence","a":"أدلة مراجعة كافية ومناسبة","x":"الكفاية مقياس للكمية، والملاءمة مقياس للجودة (الصلة والموثوقية).","s":"We were unable to obtain sufficient appropriate audit evidence.","t":"لم نتمكن من الحصول على أدلة مراجعة كافية ومناسبة.","c":3,"h":"سَفِشَنت أَپروپريَت","ka":"9b2e345b08ab","ks":"a59c31ce8f84","b":5},{"e":"Inspection","a":"الفحص المستندي / المعاينة","x":"فحص السجلات والمستندات أو المعاينة الفعلية للأصل.","s":"Inspection of contracts confirmed the payment terms.","t":"فحص العقود أكّد شروط السداد.","c":3,"ka":"b4faa7ed9568","ks":"6f246a4f9abe","b":5},{"e":"Observation","a":"الملاحظة","x":"مشاهدة عملية أو إجراء بينفذه آخرون، زي حضور الجرد.","s":"Observation of the inventory count took place on 31 December.","t":"ملاحظة جرد المخزون تمت يوم 31 ديسمبر.","c":3,"ka":"c680d437163c","ks":"48f255115627","b":5},{"e":"Inquiry","a":"الاستفسار","x":"طلب معلومات من أشخاص مطلعين داخل أو خارج المنشأة؛ لوحده مش كفاية.","s":"Inquiry alone does not provide sufficient evidence.","t":"الاستفسار لوحده مابيوفرش دليل كافي.","c":3,"h":"إنكوايَري","ka":"41fff5bed96e","ks":"b0597a187eeb","b":6},{"e":"External confirmation","a":"المصادقة الخارجية","x":"رد مكتوب مباشر للمراجع من طرف تالت، زي البنوك والعملاء والموردين.","s":"External confirmations were sent to all banks.","t":"المصادقات الخارجية اتبعتت لكل البنوك.","c":3,"ka":"6759fb092e2f","ks":"d072f933e7ef","b":6},{"e":"Positive confirmation","a":"مصادقة إيجابية","x":"المرسل إليه بيُطلب منه الرد في كل الحالات سواء موافق أو لأ.","s":"Positive confirmations are used for large balances.","t":"المصادقات الإيجابية بتستخدم للأرصدة الكبيرة.","c":3,"ka":"bf0cf7f0f84a","ks":"ede8a9e1f534","b":6},{"e":"Negative confirmation","a":"مصادقة سلبية","x":"المرسل إليه بيرد بس لو مش موافق على الرصيد.","s":"Negative confirmations provide less persuasive evidence.","t":"المصادقات السلبية بتدي دليل أقل إقناعًا.","c":3,"ka":"16f9edd92296","ks":"53abd2f6568c","b":6},{"e":"Recalculation","a":"إعادة الحساب","x":"التحقق من الدقة الحسابية للمستندات أو السجلات.","s":"Recalculation of interest expense showed no differences.","t":"إعادة حساب مصروف الفوائد لم تُظهر فروق.","c":3,"ka":"a746b882f79c","ks":"b43ecdbbb0f8","b":6},{"e":"Reperformance","a":"إعادة التنفيذ","x":"تنفيذ المراجع بنفسه لإجراء أو ضابط رقابي كان اتنفذ قبل كده.","s":"Reperformance of the bank reconciliation confirmed its accuracy.","t":"إعادة تنفيذ تسوية البنك أكدت دقتها.","c":3,"ka":"2fe2b02365eb","ks":"b2c89d24f1c5","b":6},{"e":"Vouching","a":"المراجعة المستندية","x":"التتبع من القيد في الدفاتر رجوعًا للمستند المؤيد؛ بيختبر الوجود والحدوث.","s":"Vouching of additions to invoices tests existence.","t":"مراجعة الإضافات على الفواتير بتختبر الوجود.","c":3,"h":"ڤاوتشِنج","ka":"5e63ff6cf610","ks":"6732ed11f598","b":6},{"e":"Tracing","a":"التتبع","x":"التتبع من المستند الأصلي للدفاتر؛ بيختبر الاكتمال.","s":"Tracing goods received notes to the ledger tests completeness.","t":"تتبع أذون الاستلام للدفتر بيختبر الاكتمال.","c":3,"ka":"148619be1531","ks":"805d230770ae","b":6},{"e":"Supporting documents","a":"المستندات المؤيدة","x":"فواتير وعقود وأذون وإشعارات بتؤيد القيد المحاسبي.","s":"The entry lacks supporting documents.","t":"القيد مالوش مستندات مؤيدة.","c":3,"ka":"9830fe3dd31c","ks":"9008ee7c20b5","b":6},{"e":"Audit sampling","a":"المعاينة في المراجعة","x":"تطبيق الإجراءات على أقل من 100% من البنود بحيث كل وحدة ليها فرصة اختيار.","s":"Audit sampling was used to test expenses.","t":"المعاينة اتستخدمت لاختبار المصروفات.","c":3,"ka":"26a3b33f4dcf","ks":"688c68286c6c","b":6},{"e":"Population","a":"المجتمع","x":"مجموعة البيانات الكاملة اللي بتتاخد منها العينة.","s":"The population consists of all sales invoices for the year.","t":"المجتمع بيتكون من كل فواتير مبيعات السنة.","c":3,"ka":"13e038738598","ks":"c1fa0ef571a1","b":6},{"e":"Sample size","a":"حجم العينة","x":"عدد البنود المختارة للاختبار، وبيتأثر بالمخاطر والأهمية النسبية.","s":"A higher risk requires a larger sample size.","t":"الخطر الأعلى بيتطلب حجم عينة أكبر.","c":3,"ka":"07204708b802","ks":"de95234c3bdc","b":6},{"e":"Sampling risk","a":"خطر المعاينة","x":"خطر إن استنتاج المراجع من العينة يختلف عن الاستنتاج لو فحص المجتمع كله.","s":"Sampling risk can be reduced by increasing the sample size.","t":"خطر المعاينة ممكن يقل بزيادة حجم العينة.","c":3,"ka":"245d5102a3df","ks":"8ce5fb9c71e7","b":6},{"e":"Random selection","a":"الاختيار العشوائي","x":"اختيار بنود العينة بحيث كل بند ليه نفس فرصة الاختيار.","s":"Random selection avoids bias in the sample.","t":"الاختيار العشوائي بيتجنب التحيز في العينة.","c":3,"ka":"ed7d9270e0d1","ks":"7e07c4a75fa1","b":6},{"e":"Stratification","a":"التقسيم الطبقي","x":"تقسيم المجتمع لمجموعات متشابهة (حسب القيمة مثلًا) قبل سحب العينة.","s":"Stratification focuses testing on high-value items.","t":"التقسيم الطبقي بيركّز الاختبار على البنود عالية القيمة.","c":3,"h":"ستراتِفِكَيشَن","ka":"69d48d3dd63f","ks":"47a83716a01c","b":6},{"e":"Projected misstatement","a":"التحريف المتوقع (المعمّم)","x":"تعميم التحريف المكتشف في العينة على المجتمع كله.","s":"The projected misstatement exceeds performance materiality.","t":"التحريف المعمّم أكبر من الأهمية النسبية للتنفيذ.","c":3,"ka":"8dcce01ce0b6","ks":"1d6b9e5446d2","b":6},{"e":"Working papers","a":"أوراق العمل","x":"توثيق المراجع للإجراءات المنفذة والأدلة والاستنتاجات.","s":"Working papers must be clear enough for an experienced reviewer.","t":"أوراق العمل لازم تكون واضحة كفاية لمراجع ذي خبرة.","c":3,"ka":"cc601984666c","ks":"b656bd7fe455","b":6},{"e":"Audit documentation","a":"توثيق المراجعة","x":"سجل الإجراءات والأدلة والاستنتاجات اللي بيكوّن ملف المراجعة.","s":"Audit documentation should be completed on a timely basis.","t":"توثيق المراجعة لازم يكمل في الوقت المناسب.","c":3,"ka":"a2efe767c9b2","ks":"0fcdbe4f71d8","b":6},{"e":"Lead schedule","a":"الكشف الرئيسي","x":"ورقة عمل بتلخص أرصدة البند وبتربطه بالميزان وأوراق التفاصيل.","s":"The lead schedule agrees with the trial balance.","t":"الكشف الرئيسي مطابق لميزان المراجعة.","c":3,"ka":"57bf4fd34428","ks":"878598ce1694","b":6},{"e":"Cross-reference","a":"الإحالة المرجعية","x":"ربط الأرقام بين أوراق العمل وبعضها وبين القوائم بعلامات مرجعية.","s":"Every figure in the notes has a cross-reference to the working papers.","t":"كل رقم في الإيضاحات ليه إحالة مرجعية لأوراق العمل.","c":3,"ka":"c309c125bc74","ks":"61784a91fa40","b":6},{"e":"Tick mark","a":"علامة المراجعة","x":"رمز بيحطه المراجع جنب الرقم يوضح الإجراء اللي اتعمل عليه.","s":"A legend explains each tick mark used.","t":"في مفتاح بيشرح كل علامة مراجعة مستخدمة.","c":3,"ka":"83f04b52569e","ks":"84fe2addcad7","b":6},{"e":"Casting","a":"التجميع الرأسي","x":"إعادة جمع الأعمدة للتأكد من صحة الإجماليات.","s":"We checked the casting of the fixed assets register.","t":"راجعنا تجميع سجل الأصول الثابتة.","c":3,"ka":"86a59ad7ba23","ks":"63a8fcfe4cc7","b":6},{"e":"Permanent file","a":"الملف الدائم","x":"ملف فيه معلومات مستمرة الأهمية عن العميل، زي عقد التأسيس والعقود طويلة الأجل.","s":"The articles of association are kept in the permanent file.","t":"النظام الأساسي محفوظ في الملف الدائم.","c":3,"ka":"4da49b657569","ks":"56a8c1528eaf","b":6},{"e":"Current file","a":"الملف الجاري","x":"ملف أوراق عمل السنة محل المراجعة.","s":"The current file contains this year's working papers.","t":"الملف الجاري فيه أوراق عمل السنة دي.","c":3,"ka":"bd8aac26966e","ks":"5bfd94fff30a","b":6},{"e":"Fieldwork","a":"العمل الميداني","x":"تنفيذ إجراءات المراجعة في مقر العميل.","s":"Fieldwork is scheduled for the second week of January.","t":"العمل الميداني متحدد في الأسبوع التاني من يناير.","c":3,"ka":"63012db409a9","ks":"579d5c073c7c","b":6},{"e":"Interim audit","a":"المراجعة المرحلية","x":"زيارة قبل نهاية السنة لاختبار الرقابة والمعاملات.","s":"Controls were tested during the interim audit.","t":"الرقابة اتُختبرت خلال المراجعة المرحلية.","c":3,"ka":"52ac4d6df1af","ks":"b86d721ef7b9","b":6},{"e":"Inventory count","a":"جرد المخزون","x":"العد الفعلي للمخزون ومطابقته بالسجلات.","s":"We attended the inventory count at the main warehouse.","t":"حضرنا جرد المخزون في المخزن الرئيسي.","c":3,"ka":"cb27f7d8d343","ks":"b177f7d2a523","b":6},{"e":"Cash count","a":"جرد الخزينة","x":"عد النقدية الفعلية بالخزينة ومطابقتها بالرصيد الدفتري.","s":"A surprise cash count revealed a shortage.","t":"جرد خزينة مفاجئ أظهر عجز.","c":3,"ka":"f628967a2f59","ks":"3c2daab7bf85","b":6},{"e":"Bank confirmation","a":"مصادقة البنك","x":"شهادة من البنك مباشرة للمراجع بالأرصدة والتسهيلات والضمانات.","s":"The bank confirmation shows an undisclosed loan.","t":"مصادقة البنك أظهرت قرض غير مفصح عنه.","c":3,"ka":"6a9567a4fea5","ks":"46ec29ab07b3","b":6},{"e":"Roll-forward","a":"إجراءات الترحيل للأمام","x":"إجراءات بتغطي الفترة بين تاريخ الاختبار المرحلي ونهاية السنة.","s":"Roll-forward procedures covered the last two months.","t":"إجراءات الترحيل للأمام غطّت آخر شهرين.","c":3,"ka":"d5c846fdcf2c","ks":"09ca47ba0b30","b":6},{"e":"Unrecorded liabilities","a":"الالتزامات غير المسجلة","x":"التزامات تخص الفترة وماتسجلتش؛ بتُختبر بفحص المدفوعات اللاحقة.","s":"We searched for unrecorded liabilities by reviewing subsequent payments.","t":"بحثنا عن الالتزامات غير المسجلة بمراجعة المدفوعات اللاحقة.","c":3,"ka":"6a2646b82835","ks":"58b92eeb48d2","b":6},{"e":"Subsequent receipts","a":"المتحصلات اللاحقة","x":"تحصيلات بعد نهاية السنة بتُستخدم كدليل على وجود وقابلية تحصيل أرصدة العملاء.","s":"Subsequent receipts support the recoverability of receivables.","t":"المتحصلات اللاحقة بتؤيد قابلية تحصيل العملاء.","c":3,"ka":"4755d6462839","ks":"988a809c777c","b":6},{"e":"Ageing analysis","a":"تحليل أعمار الديون","x":"تقسيم أرصدة العملاء حسب مدة استحقاقها لتقييم التحصيل والمخصص.","s":"The ageing analysis shows balances overdue by more than a year.","t":"تحليل الأعمار بيظهر أرصدة متأخرة أكتر من سنة.","c":3,"h":"إيچِنج","ka":"f5ea9d09e7c5","ks":"356f211c8785","b":6},{"e":"Journal entry testing","a":"اختبار القيود اليومية","x":"فحص القيود غير العادية أو اليدوية لمواجهة خطر تجاوز الإدارة.","s":"Journal entry testing focused on entries posted at year end.","t":"اختبار القيود ركّز على القيود المسجلة في نهاية السنة.","c":3,"ka":"bd37dd5783d5","ks":"3fd5c3c7c4bd","b":6},{"e":"Management representation letter","a":"خطاب إقرارات الإدارة","x":"إقرار مكتوب من الإدارة بمسؤوليتها عن القوائم واكتمال المعلومات المقدمة للمراجع.","s":"The management representation letter is dated the same as the audit report.","t":"خطاب إقرارات الإدارة بنفس تاريخ تقرير المراجعة.","c":3,"h":"رِپرِزِنتَيشَن","ka":"418cc364fcad","ks":"d0c04e5e9048","b":6},{"e":"Audit adjustment","a":"تسوية المراجعة","x":"قيد بيقترحه المراجع لتصحيح تحريف مكتشف.","s":"Management accepted all proposed audit adjustments.","t":"الإدارة قبلت كل تسويات المراجعة المقترحة.","c":3,"ka":"25652fa9b4ed","ks":"09bc4e885e00","b":6},{"e":"Uncorrected misstatements","a":"التحريفات غير المصححة","x":"تحريفات جمعها المراجع والإدارة ماصححتهاش؛ بيتقيّم أثرها مجتمعة.","s":"The summary of uncorrected misstatements is below materiality.","t":"ملخص التحريفات غير المصححة أقل من الأهمية النسبية.","c":3,"ka":"dd35fdc1ce56","ks":"c4be96e37dee","b":6},{"e":"Auditor's report","a":"تقرير مراقب الحسابات","x":"المستند اللي المراجع بيبدي فيه رأيه على القوائم المالية.","s":"The auditor's report is addressed to the shareholders.","t":"تقرير مراقب الحسابات موجّه للمساهمين.","c":3,"ka":"719af9751f34","ks":"c5c00d3c9ed6","b":6},{"e":"Audit opinion","a":"رأي المراجع","x":"استنتاج المراجع عن مدى عرض القوائم بعدالة في كل جوانبها الهامة.","s":"The audit opinion is based on the evidence obtained.","t":"رأي المراجع مبني على الأدلة اللي حصل عليها.","c":3,"ka":"7a3b866d3c34","ks":"ef9b986b1e7e","b":6},{"e":"Unmodified opinion","a":"رأي غير معدّل (نظيف)","x":"رأي بإن القوائم معروضة بعدالة ووضوح في كل جوانبها الهامة.","s":"The auditor issued an unmodified opinion.","t":"المراجع أصدر رأي غير معدل.","c":3,"ka":"031b33aa1160","ks":"76933866eeca","b":6},{"e":"Qualified opinion","a":"رأي متحفظ","x":"رأي معدّل لما يكون التحريف أو قيد النطاق هام لكنه مش منتشر.","s":"A qualified opinion was issued due to a disagreement over a provision.","t":"صدر رأي متحفظ بسبب خلاف على مخصص.","c":3,"h":"كووليفايد","ka":"053c79ea24f8","ks":"630389bfb895","b":7},{"e":"Adverse opinion","a":"رأي عكسي","x":"رأي بإن القوائم مش معروضة بعدالة لما التحريف يكون هام ومنتشر.","s":"An adverse opinion means the financial statements are misleading.","t":"الرأي العكسي معناه إن القوائم مضللة.","c":3,"ka":"f0a00f9a7146","ks":"470dcfdc9de8","b":7},{"e":"Disclaimer of opinion","a":"الامتناع عن إبداء الرأي","x":"المراجع مابيبديش رأي لما مايقدرش يحصل على أدلة كافية والأثر المحتمل هام ومنتشر.","s":"A disclaimer of opinion was issued because records were destroyed.","t":"صدر امتناع عن إبداء الرأي لأن السجلات اتلفت.","c":3,"h":"دِسكلَيمَر","ka":"d50b83f4498b","ks":"c01a3241f618","b":7},{"e":"Basis for opinion","a":"أساس الرأي","x":"فقرة في التقرير بتوضح إن المراجعة تمت طبقًا للمعايير وسبب أي تعديل في الرأي.","s":"The basis for opinion paragraph explains the reason for the qualification.","t":"فقرة أساس الرأي بتشرح سبب التحفظ.","c":3,"ka":"73fc1fcfdcb2","ks":"5c6e510634bf","b":7},{"e":"Emphasis of matter","a":"فقرة لفت الانتباه","x":"فقرة بتلفت نظر المستخدمين لأمر مفصح عنه في القوائم ومهم لفهمها، من غير تعديل الرأي.","s":"An emphasis of matter paragraph refers to the going concern note.","t":"فقرة لفت الانتباه بتشير لإيضاح الاستمرارية.","c":3,"h":"إمفَسِس","ka":"44af0d0658cb","ks":"4fef733d44d5","b":7},{"e":"Other matter paragraph","a":"فقرة أمور أخرى","x":"فقرة عن أمر غير معروض في القوائم ومهم لفهم المراجعة أو التقرير.","s":"The other matter paragraph states that last year was audited by another auditor.","t":"فقرة أمور أخرى بتذكر إن السنة السابقة راجعها مراجع آخر.","c":3,"ka":"19aa57e9ed95","ks":"b8e659d7d8a7","b":7},{"e":"Key audit matters","a":"أمور المراجعة الرئيسية","x":"الأمور اللي كانت الأكثر أهمية في مراجعة الفترة الحالية حسب الحكم المهني.","s":"Key audit matters are reported for listed companies.","t":"أمور المراجعة الرئيسية بتتعرض للشركات المقيدة.","c":3,"ka":"e5a16d015f41","ks":"a1855aa2fbd9","b":7},{"e":"Pervasive","a":"منتشر","x":"وصف لأثر تحريف مش محصور في بنود معينة أو أساسي لفهم المستخدمين للقوائم.","s":"The effect is material and pervasive.","t":"الأثر هام ومنتشر.","c":3,"h":"پِرڤَيسِڤ","ka":"452c85f078a7","ks":"c6d2cc5b19f8","b":7},{"e":"Scope limitation","a":"قيد على النطاق","x":"عدم قدرة المراجع على تنفيذ إجراءات يراها ضرورية.","s":"Management imposed a scope limitation on inventory testing.","t":"الإدارة فرضت قيد على نطاق اختبار المخزون.","c":3,"ka":"e9c1e75e944c","ks":"a8825135c009","b":7},{"e":"Material uncertainty","a":"عدم تأكد جوهري","x":"شك هام متعلق بأحداث أو ظروف ممكن تثير شك كبير في قدرة المنشأة على الاستمرار.","s":"A material uncertainty related to going concern exists.","t":"يوجد عدم تأكد جوهري متعلق بالاستمرارية.","c":3,"ka":"6282e407c105","ks":"36c7cf940f38","b":7},{"e":"Component auditor","a":"مراجع المكوّن","x":"مراجع بيراجع المعلومات المالية لشركة تابعة أو فرع لأغراض مراجعة المجموعة.","s":"The group auditor reviewed the work of the component auditor.","t":"مراجع المجموعة راجع عمل مراجع المكوّن.","c":3,"h":"كُمپونِنت","ka":"1ac0651fa0d6","ks":"3eaa9cf47b2d","b":7},{"e":"Group audit","a":"مراجعة المجموعة","x":"مراجعة القوائم المالية المجمعة.","s":"The group audit covers five subsidiaries.","t":"مراجعة المجموعة بتغطي خمس شركات تابعة.","c":3,"ka":"a374c8b83da7","ks":"288a89a91612","b":7},{"e":"Auditor's expert","a":"خبير المراجع","x":"شخص ذو خبرة في مجال غير المحاسبة والمراجعة بيستعين بيه المراجع، زي المقيّم العقاري.","s":"We used an auditor's expert to value the land.","t":"استعنّا بخبير لتقييم الأرض.","c":3,"ka":"2cc65c16dc37","ks":"9674baf3e58c","b":7},{"e":"Service organisation","a":"مؤسسة خدمية","x":"طرف تالت بيقدم خدمات للعميل بتأثر على تقاريره المالية، زي شركة مرتبات خارجية.","s":"Payroll is outsourced to a service organisation.","t":"المرتبات مسندة لمؤسسة خدمية.","c":3,"ka":"58b024b47b4c","ks":"a39be17f72ed","b":7},{"e":"Quality control","a":"رقابة الجودة","x":"نظام المكتب لضمان الالتزام بالمعايير المهنية وإصدار تقارير مناسبة.","s":"The firm's quality control system requires partner review.","t":"نظام رقابة الجودة بالمكتب يتطلب مراجعة الشريك.","c":3,"ka":"d7ddee089661","ks":"3243460b203d","b":7},{"e":"Engagement partner","a":"الشريك المسؤول عن المهمة","x":"الشريك المسؤول عن المهمة وأدائها والتقرير الصادر.","s":"The engagement partner signed the audit report.","t":"الشريك المسؤول وقّع تقرير المراجعة.","c":3,"ka":"7239d5770800","ks":"8979acedd368","b":7},{"e":"Engagement quality review","a":"فحص رقابة جودة المهمة","x":"تقييم موضوعي قبل إصدار التقرير للأحكام الهامة اللي اتخذها الفريق.","s":"An engagement quality review is required for listed entities.","t":"فحص رقابة الجودة مطلوب للمنشآت المقيدة.","c":3,"ka":"1fd0ebf76ee6","ks":"6616ae441823","b":7},{"e":"Ethical requirements","a":"المتطلبات الأخلاقية","x":"قواعد السلوك المهني: النزاهة، الموضوعية، الكفاءة، السرية، السلوك المهني.","s":"The team complied with all relevant ethical requirements.","t":"الفريق التزم بكل المتطلبات الأخلاقية ذات الصلة.","c":3,"ka":"b48039353b69","ks":"b0cbcfca4716","b":7},{"e":"Integrity","a":"النزاهة","x":"إن المراجع يكون أمين وصريح في كل علاقاته المهنية.","s":"Integrity is the first fundamental ethical principle.","t":"النزاهة أول مبدأ أخلاقي أساسي.","c":3,"ka":"f3f97de67c80","ks":"3b84355316af","b":7},{"e":"Objectivity","a":"الموضوعية","x":"عدم السماح للتحيز أو تضارب المصالح بالتأثير على الحكم المهني.","s":"Objectivity may be threatened by a close relationship with the client.","t":"الموضوعية ممكن تتهدد بعلاقة قريبة مع العميل.","c":3,"h":"أوبچِكتِڤِتي","ka":"6eb454def9d9","ks":"b895c46ce2fa","b":7},{"e":"Confidentiality","a":"السرية","x":"عدم إفشاء معلومات العميل لطرف تالت بدون تصريح.","s":"Confidentiality applies even after the engagement ends.","t":"السرية سارية حتى بعد انتهاء المهمة.","c":3,"h":"كُنفِدِنشيالِتي","ka":"7310289d42f6","ks":"f48756125a83","b":7},{"e":"Conflict of interest","a":"تضارب المصالح","x":"موقف مصلحة شخصية فيه ممكن تأثر على الموضوعية.","s":"The partner declared a conflict of interest.","t":"الشريك أفصح عن تضارب مصالح.","c":3,"ka":"318bde88e01e","ks":"6f898cd8d7d4","b":7},{"e":"Self-review threat","a":"تهديد المراجعة الذاتية","x":"خطر إن المراجع يراجع عمل هو نفسه أو مكتبه اللي عمله قبل كده.","s":"Preparing the client's accounts creates a self-review threat.","t":"إعداد حسابات العميل بيعمل تهديد مراجعة ذاتية.","c":3,"h":"ثرِت","ka":"515f610e5956","ks":"4ec2f8b22dcb","b":7},{"e":"Safeguards","a":"الضمانات الوقائية","x":"إجراءات بتزيل التهديدات للاستقلالية أو تقللها لمستوى مقبول.","s":"Safeguards include rotating the engagement partner.","t":"الضمانات تشمل تدوير الشريك المسؤول.","c":3,"ka":"87383521fc5f","ks":"e81b9735a623","b":7},{"e":"Non-compliance","a":"عدم الالتزام بالقوانين","x":"مخالفة المنشأة للقوانين واللوائح السارية.","s":"Non-compliance with tax law may result in penalties.","t":"عدم الالتزام بقانون الضرائب ممكن ينتج عنه غرامات.","c":3,"ka":"ef0c02da4ea0","ks":"34239b6f27bd","b":7},{"e":"Litigation and claims","a":"الدعاوى القضائية والمطالبات","x":"قضايا ومطالبات ضد المنشأة ممكن ينتج عنها التزامات.","s":"We sent a letter to the lawyer about litigation and claims.","t":"بعتنا خطاب للمحامي عن الدعاوى والمطالبات.","c":3,"h":"لِتِجَيشَن","ka":"c78d912be5da","ks":"54bce5fa4bab","b":7},{"e":"Corporate governance","a":"حوكمة الشركات","x":"نظام توجيه الشركة والرقابة عليها وتوزيع الحقوق والمسؤوليات.","s":"Good corporate governance reduces the risk of fraud.","t":"حوكمة الشركات الجيدة بتقلل خطر الغش.","c":3,"ka":"c0159eed24c7","ks":"75fb8b7fcaec","b":7},{"e":"Due diligence","a":"الفحص النافي للجهالة","x":"فحص شامل لشركة قبل الاستحواذ أو الاستثمار لتقييم وضعها المالي ومخاطرها.","s":"The investor requested financial due diligence before the acquisition.","t":"المستثمر طلب فحص نافي للجهالة قبل الاستحواذ.","c":3,"h":"ديو دِلِچَنس","ka":"65e0cfc06307","ks":"d22ab87ce03e","b":7},{"e":"Forensic audit","a":"المراجعة الجنائية (القضائية)","x":"فحص متخصص للتحقيق في الغش والنزاعات المالية.","s":"A forensic audit was ordered after the fraud was discovered.","t":"تم طلب مراجعة جنائية بعد اكتشاف الغش.","c":3,"h":"فورِنزِك","ka":"38d3d0ad5e89","ks":"b8721cd50f15","b":7},{"e":"Tax","a":"ضريبة","x":"مبلغ إلزامي بتفرضه الدولة على الدخل أو الاستهلاك أو الثروة بدون مقابل مباشر.","s":"Every company must pay tax on its profits.","t":"كل شركة لازم تدفع ضريبة على أرباحها.","c":4,"ka":"4b78ac8eb158","ks":"ddc20c68fc3a","b":7},{"e":"Taxpayer","a":"الممول","x":"الشخص الطبيعي أو الاعتباري الملزم بأداء الضريبة.","s":"The taxpayer filed the return before the deadline.","t":"الممول قدّم الإقرار قبل الميعاد.","c":4,"ka":"6014e6b14373","ks":"2582738847a2","b":7},{"e":"Tax authority","a":"مصلحة الضرائب","x":"الجهة الحكومية المسؤولة عن ربط وتحصيل الضرائب (في مصر: مصلحة الضرائب المصرية).","s":"The tax authority requested additional documents.","t":"مصلحة الضرائب طلبت مستندات إضافية.","c":4,"h":"أوثوريتي","ka":"58b26100c29b","ks":"27dcae9eb134","b":7},{"e":"Income tax","a":"ضريبة الدخل","x":"ضريبة على صافي دخل الأشخاص الطبيعيين وأرباح الأشخاص الاعتبارية (القانون 91 لسنة 2005).","s":"Income tax expense is shown in the statement of profit or loss.","t":"مصروف ضريبة الدخل بيظهر في قائمة الأرباح أو الخسائر.","c":4,"ka":"3e78c92cc7db","ks":"94091017e478","b":7},{"e":"Corporate income tax","a":"ضريبة أرباح الأشخاص الاعتبارية","x":"ضريبة على صافي الربح الضريبي للشركات؛ السعر العام في مصر 22.5%.","s":"Corporate income tax in Egypt is generally 22.5 percent.","t":"ضريبة الشركات في مصر بشكل عام 22.5%.","c":4,"ka":"f4c7902dc461","ks":"6187e219bc18","b":7},{"e":"Value added tax","a":"ضريبة القيمة المضافة","x":"ضريبة غير مباشرة على السلع والخدمات في كل مرحلة (القانون 67 لسنة 2016)؛ السعر العام 14%.","s":"Value added tax is charged at the standard rate of fourteen percent.","t":"ضريبة القيمة المضافة بتتفرض بالسعر العام 14%.","c":4,"ka":"aa9f250f576f","ks":"b228ec314131","b":7},{"e":"Withholding tax","a":"الخصم تحت حساب الضريبة / الخصم من المنبع","x":"مبلغ بيخصمه الدافع من المدفوع ويورده للمصلحة لحساب المستلم.","s":"Withholding tax was deducted from the supplier's invoice.","t":"تم خصم ضريبة من المنبع من فاتورة المورد.","c":4,"ka":"b6fbad096409","ks":"0b0513124173","b":7},{"e":"Salary tax","a":"ضريبة المرتبات (كسب العمل)","x":"ضريبة على دخل الموظفين بيخصمها صاحب العمل شهريًا ويوردها.","s":"Salary tax is withheld monthly by the employer.","t":"ضريبة المرتبات بيخصمها صاحب العمل شهريًا.","c":4,"ka":"c0cbfa7f6831","ks":"d7d265eb53ca","b":7},{"e":"Stamp duty","a":"ضريبة الدمغة","x":"ضريبة على مستندات ومعاملات معينة زي التسهيلات البنكية والإعلانات (القانون 111 لسنة 1980).","s":"Stamp duty applies to bank credit facilities.","t":"ضريبة الدمغة بتطبق على التسهيلات الائتمانية البنكية.","c":4,"ka":"fc90647077a6","ks":"43c7a69e0996","b":7},{"e":"Real estate tax","a":"الضريبة العقارية","x":"ضريبة سنوية على العقارات المبنية على أساس القيمة الإيجارية.","s":"The factory building is subject to real estate tax.","t":"مبنى المصنع خاضع للضريبة العقارية.","c":4,"ka":"f49d8cebef36","ks":"609dbd1409fa","b":7},{"e":"Table tax","a":"ضريبة الجدول","x":"ضريبة على سلع وخدمات محددة في الجدول المرافق لقانون القيمة المضافة، ومدخلاتها غالبًا مش بتتخصم.","s":"Contracting services are subject to table tax.","t":"خدمات المقاولات خاضعة لضريبة الجدول.","c":4,"ka":"bfb9c7604315","ks":"7814e3286406","b":7},{"e":"Customs duties","a":"الرسوم الجمركية","x":"ضرائب بتتفرض على السلع المستوردة عند دخولها البلد.","s":"Customs duties are included in the cost of imported inventory.","t":"الرسوم الجمركية بتدخل في تكلفة المخزون المستورد.","c":4,"ka":"1ecdfc294a4e","ks":"aca0c3106646","b":8},{"e":"Capital gains tax","a":"ضريبة الأرباح الرأسمالية","x":"ضريبة على الربح الناتج من بيع أصل رأسمالي زي الأسهم أو العقارات.","s":"Capital gains tax applies to the sale of unlisted shares.","t":"ضريبة الأرباح الرأسمالية بتطبق على بيع الأسهم غير المقيدة.","c":4,"ka":"b382cfe0ee51","ks":"073a74279e37","b":8},{"e":"Dividend tax","a":"ضريبة التوزيعات","x":"ضريبة بتتخصم من توزيعات الأرباح المدفوعة للمساهمين.","s":"Dividend tax is withheld by the distributing company.","t":"ضريبة التوزيعات بتخصمها الشركة الموزعة.","c":4,"ka":"bdf2762eb69d","ks":"d5d3761834f9","b":8},{"e":"Tax return","a":"الإقرار الضريبي","x":"نموذج بيقدمه الممول للمصلحة بيبيّن فيه دخله والضريبة المستحقة.","s":"The annual tax return is filed electronically.","t":"الإقرار الضريبي السنوي بيتقدم إلكترونيًا.","c":4,"ka":"c4cd88f34685","ks":"0e63c2d38f7b","b":8},{"e":"Filing deadline","a":"ميعاد تقديم الإقرار","x":"آخر تاريخ قانوني لتقديم الإقرار بدون غرامة.","s":"The filing deadline for companies is four months after year end.","t":"ميعاد تقديم إقرار الشركات أربع شهور بعد نهاية السنة.","c":4,"ka":"fb7e2a6f408c","ks":"d32f1308ef10","b":8},{"e":"Tax period","a":"الفترة الضريبية","x":"المدة اللي بتتحسب عنها الضريبة (سنة للدخل، شهر للقيمة المضافة).","s":"The VAT tax period is one month.","t":"الفترة الضريبية للقيمة المضافة شهر.","c":4,"ka":"5ab06e32e25c","ks":"799726598830","b":8},{"e":"Taxable income","a":"الدخل الخاضع للضريبة / الوعاء الضريبي","x":"صافي الربح المحاسبي بعد تعديله بالإضافات والخصومات الضريبية.","s":"Taxable income differs from accounting profit.","t":"الوعاء الضريبي بيختلف عن الربح المحاسبي.","c":4,"ka":"b0360a42d8cf","ks":"c5902f512c1c","b":8},{"e":"Accounting profit","a":"الربح المحاسبي","x":"صافي الربح طبقًا للقوائم المالية قبل التعديلات الضريبية.","s":"We reconciled accounting profit to taxable income.","t":"عملنا تسوية بين الربح المحاسبي والوعاء الضريبي.","c":4,"ka":"f51581223235","ks":"3b42d1525215","b":8},{"e":"Tax rate","a":"سعر الضريبة","x":"النسبة المئوية المطبقة على الوعاء لحساب الضريبة.","s":"The applicable tax rate is used to measure deferred tax.","t":"سعر الضريبة الساري بيستخدم لقياس الضريبة المؤجلة.","c":4,"ka":"20a34c4e30c5","ks":"496510579572","b":8},{"e":"Effective tax rate","a":"معدل الضريبة الفعلي","x":"مصروف الضريبة مقسوم على الربح المحاسبي قبل الضريبة.","s":"The effective tax rate is higher because of non-deductible expenses.","t":"معدل الضريبة الفعلي أعلى بسبب المصروفات غير المعتمدة.","c":4,"ka":"33fdbc3c7266","ks":"cd8d1cef2528","b":8},{"e":"Deductible expenses","a":"التكاليف واجبة الخصم","x":"مصروفات القانون بيسمح بخصمها من الإيراد للوصول للوعاء (مرتبطة بالنشاط ومؤيدة بمستندات).","s":"Only deductible expenses reduce taxable income.","t":"التكاليف واجبة الخصم بس هي اللي بتقلل الوعاء.","c":4,"h":"دِدَكتِبُل","ka":"e8a0b4c0ecf0","ks":"f9df0da0c36b","b":8},{"e":"Non-deductible expenses","a":"مصروفات غير معتمدة ضريبيًا","x":"مصروفات بتترد للوعاء لأن القانون مابيسمحش بخصمها، زي الغرامات وبعض المخصصات.","s":"Fines and penalties are non-deductible expenses.","t":"الغرامات والجزاءات مصروفات غير معتمدة ضريبيًا.","c":4,"ka":"a9faeb186354","ks":"5e38028fe442","b":8},{"e":"Tax adjustments","a":"التسويات الضريبية","x":"الإضافات والخصومات على الربح المحاسبي في الإقرار للوصول للوعاء.","s":"Tax adjustments include adding back accounting depreciation.","t":"التسويات الضريبية تشمل رد الإهلاك المحاسبي.","c":4,"ka":"183dc852640f","ks":"a594a0f52352","b":8},{"e":"Tax depreciation","a":"الإهلاك الضريبي","x":"الإهلاك المحسوب بالنسب والطرق اللي حددها قانون الضريبة مش السياسة المحاسبية.","s":"Tax depreciation is deducted instead of accounting depreciation.","t":"الإهلاك الضريبي بيتخصم بدل الإهلاك المحاسبي.","c":4,"ka":"ea3f1a743b7d","ks":"13eef2f3c887","b":8},{"e":"Tax losses carried forward","a":"الخسائر الضريبية المرحّلة","x":"خسائر ضريبية مسموح بخصمها من أرباح السنوات التالية (في مصر لمدة خمس سنوات).","s":"Tax losses carried forward can be used for five years.","t":"الخسائر المرحّلة ممكن تُستخدم لمدة خمس سنين.","c":4,"ka":"e1e796a54ef1","ks":"55724164433c","b":8},{"e":"Exempt income","a":"الدخل المعفى","x":"إيراد القانون بيعفيه من الضريبة.","s":"Exempt income is deducted in the tax return.","t":"الدخل المعفى بيتخصم في الإقرار.","c":4,"h":"إجزِمت","ka":"64a827aad4d4","ks":"fa65059dcbe5","b":8},{"e":"Tax exemption","a":"الإعفاء الضريبي","x":"استثناء قانوني لدخل أو نشاط أو شخص من الخضوع للضريبة.","s":"The project enjoys a tax exemption under the investment law.","t":"المشروع متمتع بإعفاء ضريبي طبقًا لقانون الاستثمار.","c":4,"ka":"7accb47cc63a","ks":"06f017ed8146","b":8},{"e":"Tax incentive","a":"الحافز الضريبي","x":"ميزة ضريبية بتقدمها الدولة لتشجيع استثمار أو نشاط معين.","s":"The investment law offers a tax incentive for certain zones.","t":"قانون الاستثمار بيقدم حافز ضريبي لمناطق معينة.","c":4,"h":"إنسِنتِڤ","ka":"0d75f5033306","ks":"7e33873f8b7f","b":8},{"e":"Free zone","a":"المنطقة الحرة","x":"منطقة ليها معاملة جمركية وضريبية خاصة للمشروعات المقامة فيها.","s":"Companies in a free zone follow special tax rules.","t":"شركات المنطقة الحرة بتتبع قواعد ضريبية خاصة.","c":4,"ka":"f59262bf6d6a","ks":"27ff3bf9aa74","b":8},{"e":"Tax credit","a":"الخصم الضريبي / الرصيد الدائن","x":"مبلغ بيتخصم من الضريبة المستحقة نفسها، زي الضريبة المخصومة من المنبع أو المدفوعة بالخارج.","s":"Withholding tax certificates are used as a tax credit.","t":"شهادات الخصم من المنبع بتستخدم كرصيد دائن ضريبي.","c":4,"ka":"3603b21aa7da","ks":"1ed519e074da","b":8},{"e":"Advance payments","a":"الدفعات المقدمة","x":"مبالغ بيدفعها الممول خلال السنة تحت حساب ضريبة السنة.","s":"The company chose the advance payments system.","t":"الشركة اختارت نظام الدفعات المقدمة.","c":4,"ka":"b4e419b20735","ks":"8ae368b80d0f","b":8},{"e":"Current tax","a":"الضريبة الجارية","x":"ضريبة الدخل المستحقة عن الوعاء الضريبي للفترة الحالية.","s":"Current tax is calculated based on the tax return.","t":"الضريبة الجارية بتتحسب على أساس الإقرار.","c":4,"ka":"a3b7be100e03","ks":"d6b1f8e76aac","b":8},{"e":"Deferred tax asset","a":"أصل ضريبي مؤجل","x":"ضريبة قابلة للاسترداد في المستقبل نتيجة فروق مؤقتة قابلة للخصم أو خسائر مرحّلة.","s":"A deferred tax asset is recognised only if future profits are probable.","t":"الأصل الضريبي المؤجل بيتسجل بس لو الأرباح المستقبلية مرجحة.","c":4,"ka":"b3887797c95a","ks":"a8850796aa2c","b":8},{"e":"Deferred tax liability","a":"التزام ضريبي مؤجل","x":"ضريبة مستحقة في المستقبل نتيجة فروق مؤقتة خاضعة للضريبة.","s":"Accelerated tax depreciation creates a deferred tax liability.","t":"الإهلاك الضريبي المعجّل بيعمل التزام ضريبي مؤجل.","c":4,"ka":"c3aac2956289","ks":"ccc3953797bc","b":8},{"e":"Permanent difference","a":"فرق دائم","x":"فرق بين الربح المحاسبي والضريبي مابينعكسش في المستقبل، فمابيعملش ضريبة مؤجلة.","s":"Fines create a permanent difference.","t":"الغرامات بتعمل فرق دائم.","c":4,"ka":"cc01d373579b","ks":"5d4abd3aa098","b":8},{"e":"Tax provision","a":"مخصص الضرائب","x":"مبلغ بيتكوّن لمواجهة مطالبات ضريبية محتملة عن سنوات لسه مافحصتش أو عليها نزاع.","s":"A tax provision was made for the years under dispute.","t":"تم تكوين مخصص ضرائب عن السنوات محل النزاع.","c":4,"ka":"6ecdec2d741f","ks":"793d6ca5faf6","b":8},{"e":"Tax inspection","a":"الفحص الضريبي","x":"مراجعة مصلحة الضرائب لدفاتر وإقرارات الممول للتحقق من الضريبة.","s":"The tax inspection covered the years 2020 to 2022.","t":"الفحص الضريبي غطّى السنوات من 2020 إلى 2022.","c":4,"ka":"7d227436aa01","ks":"9f6b83e3d294","b":8},{"e":"Tax assessment","a":"الربط الضريبي","x":"تحديد المصلحة للضريبة المستحقة على الممول بعد الفحص.","s":"The company objected to the tax assessment.","t":"الشركة اعترضت على الربط الضريبي.","c":4,"ka":"96c4e9bd96c1","ks":"a18e36845cff","b":8},{"e":"Deemed assessment","a":"الربط التقديري","x":"ربط الضريبة تقديريًا من المصلحة لما الممول مايقدمش دفاتر أو مستندات.","s":"A deemed assessment was issued because no books were presented.","t":"صدر ربط تقديري لعدم تقديم دفاتر.","c":4,"ka":"0cfd4a05de64","ks":"7616b9b56c8d","b":8},{"e":"Tax dispute","a":"النزاع الضريبي","x":"خلاف بين الممول والمصلحة على الربط.","s":"The tax dispute was transferred to the appeal committee.","t":"النزاع الضريبي اتحوّل للجنة الطعن.","c":4,"ka":"82c9667cede8","ks":"debe6de3ce09","b":8},{"e":"Internal committee","a":"اللجنة الداخلية","x":"أول مرحلة لحل الخلاف بين الممول والمأمورية بعد الاعتراض على الربط.","s":"The dispute was settled at the internal committee.","t":"الخلاف اتحل في اللجنة الداخلية.","c":4,"ka":"68231fca295f","ks":"37360d9c3bd4","b":8},{"e":"Appeal committee","a":"لجنة الطعن","x":"لجنة بتنظر النزاع لو مااتحلش في اللجنة الداخلية، وقرارها واجب النفاذ.","s":"The appeal committee reduced the tax differences.","t":"لجنة الطعن خفّضت الفروق الضريبية.","c":4,"ka":"f3c7acf367cc","ks":"e99498491877","b":8},{"e":"Tax settlement","a":"التسوية الضريبية","x":"إنهاء الموقف الضريبي عن سنة معينة وسداد المستحق.","s":"The tax settlement for 2019 was finalised.","t":"التسوية الضريبية لسنة 2019 انتهت.","c":4,"ka":"6a6a85a16d95","ks":"2142435e7ff7","b":8},{"e":"Tax position","a":"الموقف الضريبي","x":"ملخص حالة الشركة مع كل نوع ضريبة: سنوات مفحوصة، نزاعات، مستحقات. بيتعرض في الإيضاحات.","s":"The tax position note covers each type of tax.","t":"إيضاح الموقف الضريبي بيغطي كل نوع ضريبة.","c":4,"ka":"1626fb8a00cc","ks":"3a371e57ef80","b":8},{"e":"Tax differences","a":"الفروق الضريبية","x":"مبالغ إضافية بتطالب بيها المصلحة بعد الفحص زيادة عن الإقرار.","s":"Tax differences were paid in instalments.","t":"الفروق الضريبية اتسددت على أقساط.","c":4,"ka":"3ce7d99a6a72","ks":"d316e2bd8475","b":8},{"e":"Delay penalty","a":"مقابل التأخير","x":"مبلغ إضافي بيتحسب على الضريبة غير المسددة في ميعادها.","s":"A delay penalty is calculated on unpaid tax.","t":"مقابل التأخير بيتحسب على الضريبة غير المسددة.","c":4,"ka":"54135db9b92d","ks":"413ed461e02f","b":8},{"e":"Statute of limitations","a":"التقادم","x":"المدة اللي بعدها بيسقط حق المصلحة في المطالبة بالضريبة (خمس سنوات بشكل عام).","s":"The year 2018 is closed by the statute of limitations.","t":"سنة 2018 سقطت بالتقادم.","c":4,"h":"ستاتشوت","ka":"f9e85b5316af","ks":"cece8e054a70","b":8},{"e":"Tax evasion","a":"التهرب الضريبي","x":"تجنب الضريبة بطرق غير مشروعة زي إخفاء الإيرادات؛ جريمة.","s":"Tax evasion is a criminal offence.","t":"التهرب الضريبي جريمة.","c":4,"h":"إڤَيچَن","ka":"1c0ecabe1835","ks":"341ac3addd2c","b":8},{"e":"Tax avoidance","a":"التجنب الضريبي","x":"تقليل الضريبة باستغلال ثغرات القانون بطرق قانونية شكلًا.","s":"Tax avoidance is legal but may be challenged.","t":"التجنب الضريبي قانوني لكن ممكن يُطعن فيه.","c":4,"ka":"6f582f733abe","ks":"89a1b1dc50ed","b":8},{"e":"Tax planning","a":"التخطيط الضريبي","x":"ترتيب المعاملات بشكل مشروع لتقليل العبء الضريبي.","s":"Good tax planning reduces the effective tax rate.","t":"التخطيط الضريبي الجيد بيقلل معدل الضريبة الفعلي.","c":4,"ka":"4f4591d72e4e","ks":"80438acb53ba","b":8},{"e":"Tax registration","a":"التسجيل الضريبي","x":"قيد الممول لدى المصلحة والحصول على رقم تسجيل ضريبي.","s":"Tax registration is required before starting the activity.","t":"التسجيل الضريبي مطلوب قبل بدء النشاط.","c":4,"ka":"41c063caf24c","ks":"a3951e24e572","b":9},{"e":"Tax card","a":"البطاقة الضريبية","x":"مستند من المصلحة فيه بيانات الممول ورقم تسجيله ونشاطه.","s":"We obtained a copy of the valid tax card.","t":"حصلنا على صورة من البطاقة الضريبية السارية.","c":4,"ka":"071dbc11d91f","ks":"1ca0c00f8de5","b":9},{"e":"Tax registration number","a":"رقم التسجيل الضريبي","x":"الرقم الموحد اللي بيتعامل بيه الممول مع المصلحة.","s":"The tax registration number must appear on every invoice.","t":"رقم التسجيل الضريبي لازم يظهر على كل فاتورة.","c":4,"ka":"0f7d5e327053","ks":"64cff0e85b3e","b":9},{"e":"Output tax","a":"ضريبة المخرجات (على المبيعات)","x":"ضريبة القيمة المضافة اللي المسجل بيحصّلها من عملائه.","s":"Output tax is declared in the monthly VAT return.","t":"ضريبة المخرجات بتتقر في الإقرار الشهري.","c":4,"ka":"9716f6f86fcf","ks":"72cffba456d3","b":9},{"e":"Input tax","a":"ضريبة المدخلات (على المشتريات)","x":"ضريبة القيمة المضافة اللي المسجل دفعها على مشترياته وله حق خصمها.","s":"Input tax is deducted from output tax.","t":"ضريبة المدخلات بتتخصم من ضريبة المخرجات.","c":4,"ka":"728966d08e90","ks":"34fe4863eb64","b":9},{"e":"Input tax deduction","a":"خصم ضريبة المدخلات","x":"حق المسجل في خصم الضريبة المدفوعة على مدخلاته بشرط وجود فاتورة ضريبية سليمة.","s":"Input tax deduction requires a valid tax invoice.","t":"خصم المدخلات بيتطلب فاتورة ضريبية صحيحة.","c":4,"ka":"d233e9e847ec","ks":"d70cd7303087","b":9},{"e":"Tax invoice","a":"الفاتورة الضريبية","x":"فاتورة مستوفية البيانات القانونية بيصدرها المسجل عن كل بيع.","s":"A tax invoice must show the VAT amount separately.","t":"الفاتورة الضريبية لازم تظهر مبلغ الضريبة منفصل.","c":4,"ka":"7f8625a42adc","ks":"83c8f3ad522a","b":9},{"e":"Electronic invoice","a":"الفاتورة الإلكترونية","x":"فاتورة رقمية بتتسجل لحظيًا على منظومة مصلحة الضرائب ولها رقم تعريف فريد.","s":"Only an electronic invoice is accepted to support expenses.","t":"الفاتورة الإلكترونية بس هي المقبولة لتأييد المصروفات.","c":4,"ka":"1886d48b9467","ks":"7b21e8deb5d7","b":9},{"e":"Electronic receipt","a":"الإيصال الإلكتروني","x":"إيصال رقمي للبيع للمستهلك النهائي مربوط بمنظومة المصلحة.","s":"Retail shops must issue an electronic receipt.","t":"محلات التجزئة لازم تصدر إيصال إلكتروني.","c":4,"h":"رِسيت (حرف p مش بيتنطق)","ka":"16e9bd9ab4ae","ks":"93f55f11a010","b":9},{"e":"Credit note","a":"إشعار دائن / إشعار خصم","x":"مستند بيخفّض قيمة فاتورة سابقة بسبب مرتجع أو خصم.","s":"A credit note was issued for the returned goods.","t":"صدر إشعار دائن عن البضاعة المرتجعة.","c":4,"ka":"f338661e4991","ks":"8bcfc44e821a","b":9},{"e":"Debit note","a":"إشعار مدين / إشعار إضافة","x":"مستند بيزوّد قيمة فاتورة سابقة.","s":"The supplier issued a debit note for the price difference.","t":"المورد أصدر إشعار مدين بفرق السعر.","c":4,"ka":"2714f034a52d","ks":"b19d9e886de3","b":9},{"e":"Standard rate","a":"السعر العام","x":"نسبة الضريبة الأساسية المطبقة على السلع والخدمات غير المستثناة.","s":"Most goods are taxed at the standard rate.","t":"معظم السلع خاضعة بالسعر العام.","c":4,"ka":"c0434e8dc616","ks":"1eb015b2146c","b":9},{"e":"Zero-rated supplies","a":"توريدات بسعر صفر","x":"سلع وخدمات خاضعة بنسبة صفر% زي الصادرات؛ مدخلاتها بتتخصم وتُسترد.","s":"Exports are zero-rated supplies.","t":"الصادرات توريدات بسعر صفر.","c":4,"ka":"b0d16204fbd8","ks":"b21f26f433a4","b":9},{"e":"Exempt supplies","a":"توريدات معفاة","x":"سلع وخدمات معفاة من الضريبة ومدخلاتها مابتتخصمش.","s":"Input tax on exempt supplies cannot be recovered.","t":"ضريبة المدخلات على التوريدات المعفاة مابتُستردش.","c":4,"ka":"23ae7fefc57f","ks":"d83efb678ec9","b":9},{"e":"Reverse charge","a":"التكليف العكسي","x":"التزام مستورد الخدمة المقيم بحساب وتوريد الضريبة بدل المورد غير المقيم.","s":"Services from a foreign supplier are subject to reverse charge.","t":"الخدمات من مورد أجنبي خاضعة للتكليف العكسي.","c":4,"ka":"ea182ae9b0c1","ks":"0f5f76540869","b":9},{"e":"Registration threshold","a":"حد التسجيل","x":"حجم المبيعات السنوي اللي بعده التسجيل في القيمة المضافة بيبقى إلزامي.","s":"The company exceeded the registration threshold.","t":"الشركة تجاوزت حد التسجيل.","c":4,"h":"ثرِش هولد","ka":"48be8f10bb5b","ks":"5587461e694b","b":9},{"e":"VAT refund","a":"رد الضريبة","x":"استرداد المسجل لرصيده الدائن من المصلحة في الحالات المحددة.","s":"Exporters can claim a VAT refund.","t":"المصدّرين ممكن يطالبوا برد الضريبة.","c":4,"ka":"d3f9e490fbfc","ks":"c55d64154af3","b":9},{"e":"Tax point","a":"واقعة استحقاق الضريبة","x":"اللحظة اللي بتستحق فيها الضريبة، غالبًا عند البيع أو أداء الخدمة أو إصدار الفاتورة.","s":"The tax point is usually the date of the invoice.","t":"واقعة الاستحقاق غالبًا تاريخ الفاتورة.","c":4,"ka":"60d52cd77cd7","ks":"12905bd3529e","b":9},{"e":"Resident","a":"مقيم","x":"شخص بيخضع للضريبة في الدولة على دخله حسب قواعد الإقامة.","s":"A resident company is taxed on its worldwide income.","t":"الشركة المقيمة بتخضع على دخلها من كل العالم.","c":4,"ka":"bad08a863dfd","ks":"6b18c5617aa0","b":9},{"e":"Non-resident","a":"غير مقيم","x":"شخص غير مقيم بيخضع بس على دخله اللي مصدره الدولة.","s":"Payments to a non-resident are subject to withholding tax.","t":"المدفوعات لغير المقيم خاضعة للخصم من المنبع.","c":4,"ka":"f96a16bc1a4f","ks":"56df0b17191f","b":9},{"e":"Permanent establishment","a":"المنشأة الدائمة","x":"مقر ثابت لغير المقيم بيزاول من خلاله نشاط في الدولة فيخضع للضريبة فيها.","s":"The branch constitutes a permanent establishment.","t":"الفرع بيُعتبر منشأة دائمة.","c":4,"ka":"10c5888d0d83","ks":"e3bd407b22fd","b":9},{"e":"Double taxation treaty","a":"اتفاقية تجنب الازدواج الضريبي","x":"اتفاقية بين دولتين لمنع خضوع نفس الدخل للضريبة مرتين.","s":"The double taxation treaty reduces the withholding rate.","t":"اتفاقية تجنب الازدواج بتخفض نسبة الخصم.","c":4,"h":"تريتي","ka":"350862eb01cb","ks":"f51932e6c47a","b":9},{"e":"Royalties","a":"الإتاوات","x":"مبالغ مقابل استخدام حقوق زي العلامات التجارية وبراءات الاختراع والمعرفة الفنية.","s":"Royalties paid abroad are subject to withholding tax.","t":"الإتاوات المدفوعة للخارج خاضعة للخصم من المنبع.","c":4,"h":"رويَلتيز","ka":"3026f758aeee","ks":"efa135c2e0d9","b":9},{"e":"Transfer pricing","a":"تسعير المعاملات (أسعار التحويل)","x":"قواعد تسعير المعاملات بين الأطراف المرتبطة عشان تكون بالسعر المحايد.","s":"Transfer pricing documentation must be submitted with the return.","t":"مستندات تسعير المعاملات لازم تتقدم مع الإقرار.","c":4,"ka":"8e40fd5e3264","ks":"a1ddc3ef9937","b":9},{"e":"Arm's length principle","a":"مبدأ السعر المحايد","x":"إن المعاملات بين الأطراف المرتبطة تتم بنفس شروط المعاملات بين أطراف مستقلة.","s":"Related party loans must follow the arm's length principle.","t":"قروض الأطراف المرتبطة لازم تتبع السعر المحايد.","c":4,"ka":"9754ac8b4128","ks":"eecc62564244","b":9},{"e":"Thin capitalisation","a":"الرسملة الخفيفة","x":"قاعدة بتمنع خصم فوائد القروض الزيادة عن نسبة معينة من حقوق الملكية (4:1 في مصر).","s":"Interest above the thin capitalisation limit is not deductible.","t":"الفوائد الزيادة عن حد الرسملة الخفيفة غير معتمدة.","c":4,"ka":"74a336dca89f","ks":"24acb9a45668","b":9},{"e":"Social insurance","a":"التأمينات الاجتماعية","x":"اشتراكات إلزامية بيدفعها صاحب العمل والموظف لهيئة التأمينات.","s":"Social insurance contributions are paid monthly.","t":"اشتراكات التأمينات بتتسدد شهريًا.","c":4,"ka":"119e09ecf9c4","ks":"4b1d0cbe9b8f","b":9},{"e":"Payroll","a":"كشف المرتبات","x":"سجل بمرتبات العاملين والاستقطاعات وصافي المستحق.","s":"Payroll is reconciled with the salary tax returns.","t":"المرتبات بتتطابق مع إقرارات ضريبة المرتبات.","c":4,"ka":"78ab6f0d8938","ks":"f23f419297e9","b":9},{"e":"Net salary","a":"صافي المرتب","x":"المرتب بعد خصم الضريبة والتأمينات والاستقطاعات.","s":"Net salary is transferred to employees' bank accounts.","t":"صافي المرتب بيتحول لحسابات الموظفين.","c":4,"ka":"3862f41b177b","ks":"3ef007eac8c1","b":9},{"e":"Tax bracket","a":"الشريحة الضريبية","x":"نطاق من الدخل بيخضع لسعر ضريبة معين في النظام التصاعدي.","s":"Each tax bracket has a different rate.","t":"كل شريحة ضريبية ليها سعر مختلف.","c":4,"ka":"28f39011e596","ks":"f36f84705400","b":9},{"e":"Progressive tax","a":"ضريبة تصاعدية","x":"ضريبة سعرها بيزيد كل ما الدخل زاد.","s":"Salary tax in Egypt is a progressive tax.","t":"ضريبة المرتبات في مصر تصاعدية.","c":4,"ka":"ed6efbfc5287","ks":"3033465ac4e7","b":9},{"e":"Personal exemption","a":"الإعفاء الشخصي","x":"مبلغ من دخل الموظف السنوي معفى من الضريبة.","s":"The personal exemption is deducted before applying the brackets.","t":"الإعفاء الشخصي بيتخصم قبل تطبيق الشرائح.","c":4,"ka":"8bcfcb59b3a8","ks":"c1915da13c48","b":9},{"e":"Tax clearance certificate","a":"شهادة الموقف الضريبي / المخالصة","x":"شهادة من المصلحة بإن الممول مسدد المستحق عليه.","s":"A tax clearance certificate is needed for the tender.","t":"شهادة الموقف الضريبي مطلوبة للمناقصة.","c":4,"ka":"409c9650606f","ks":"a3089236394b","b":9},{"e":"Books and records","a":"الدفاتر والسجلات","x":"الدفاتر المحاسبية المنتظمة اللي القانون بيلزم الممول يمسكها ويحتفظ بيها.","s":"Books and records must be kept for five years.","t":"الدفاتر والسجلات لازم تتحفظ خمس سنين.","c":4,"ka":"c2f01c4acb0d","ks":"98de77400e8a","b":9},{"e":"Liquidity","a":"السيولة","x":"قدرة المنشأة على سداد التزاماتها قصيرة الأجل.","s":"The company faces liquidity pressure.","t":"الشركة بتواجه ضغط سيولة.","c":5,"h":"لِكوِدِتي","ka":"ced438890dad","ks":"06b4883be88c","b":9},{"e":"Solvency","a":"الملاءة المالية","x":"قدرة المنشأة على سداد التزاماتها طويلة الأجل.","s":"High debt threatens the company's solvency.","t":"الديون العالية بتهدد ملاءة الشركة.","c":5,"h":"سُلڤِنسي","ka":"7204e837bb0a","ks":"c01fbba6fc58","b":9},{"e":"Profitability","a":"الربحية","x":"قدرة المنشأة على تحقيق أرباح من نشاطها.","s":"Profitability improved after cost reductions.","t":"الربحية اتحسنت بعد تخفيض التكاليف.","c":5,"ka":"98fea60a1933","ks":"4d5d6bc12a56","b":9},{"e":"Current ratio","a":"نسبة التداول","x":"الأصول المتداولة ÷ الالتزامات المتداولة.","s":"A current ratio below one may indicate liquidity risk.","t":"نسبة التداول الأقل من واحد ممكن تدل على خطر سيولة.","c":5,"h":"رَيشيو","ka":"6de0f97b105e","ks":"d0b68876cbc6","b":9},{"e":"Quick ratio","a":"نسبة السيولة السريعة","x":"(الأصول المتداولة − المخزون) ÷ الالتزامات المتداولة.","s":"The quick ratio excludes inventory.","t":"نسبة السيولة السريعة بتستبعد المخزون.","c":5,"ka":"d35eef3f91ce","ks":"72690043e623","b":9},{"e":"Debt-to-equity ratio","a":"نسبة الديون إلى حقوق الملكية","x":"إجمالي الديون ÷ حقوق الملكية؛ بتقيس الرافعة المالية.","s":"The debt-to-equity ratio increased after the new loan.","t":"نسبة الديون لحقوق الملكية زادت بعد القرض الجديد.","c":5,"ka":"1528a5722bf6","ks":"bb61523580b6","b":9},{"e":"Leverage","a":"الرافعة المالية","x":"مدى اعتماد المنشأة على الديون في تمويل أصولها.","s":"High leverage increases financial risk.","t":"الرافعة العالية بتزوّد المخاطر المالية.","c":5,"h":"لِڤَرِدچ","ka":"f6d322d1c8b6","ks":"d02e23c2b3d7","b":10},{"e":"Gross margin","a":"هامش مجمل الربح","x":"مجمل الربح ÷ الإيرادات.","s":"The gross margin fell due to higher raw material prices.","t":"هامش مجمل الربح قل بسبب ارتفاع أسعار الخامات.","c":5,"ka":"ad2b02ef3f96","ks":"da0aabb506cc","b":10},{"e":"Return on equity","a":"العائد على حقوق الملكية","x":"صافي الربح ÷ متوسط حقوق الملكية.","s":"Return on equity measures the return to shareholders.","t":"العائد على حقوق الملكية بيقيس عائد المساهمين.","c":5,"ka":"400b3c2bbf15","ks":"151ca397048f","b":10},{"e":"Return on assets","a":"العائد على الأصول","x":"صافي الربح ÷ متوسط إجمالي الأصول.","s":"Return on assets shows how efficiently assets are used.","t":"العائد على الأصول بيوضح كفاءة استخدام الأصول.","c":5,"ka":"42be9ead8cce","ks":"65be94a6053a","b":10},{"e":"Receivables turnover","a":"معدل دوران العملاء","x":"المبيعات الآجلة ÷ متوسط رصيد العملاء؛ بيقيس سرعة التحصيل.","s":"A lower receivables turnover suggests slower collection.","t":"انخفاض معدل دوران العملاء بيدل على تحصيل أبطأ.","c":5,"ka":"e004f942b6fe","ks":"30ed99562e19","b":10},{"e":"Inventory turnover","a":"معدل دوران المخزون","x":"تكلفة المبيعات ÷ متوسط المخزون.","s":"Inventory turnover declined, indicating slow-moving stock.","t":"معدل دوران المخزون قل، وده بيدل على مخزون راكد.","c":5,"ka":"9335553fdd03","ks":"107689e43e2e","b":10},{"e":"Horizontal analysis","a":"التحليل الأفقي","x":"مقارنة كل بند بنفس البند في فترات سابقة.","s":"Horizontal analysis shows a fifty percent rise in receivables.","t":"التحليل الأفقي بيظهر زيادة 50% في العملاء.","c":5,"ka":"e0223c1d9e88","ks":"baf97758794d","b":10},{"e":"Vertical analysis","a":"التحليل الرأسي","x":"نسبة كل بند لإجمالي معين (الإيرادات أو الأصول) في نفس الفترة.","s":"Vertical analysis presents each expense as a percentage of revenue.","t":"التحليل الرأسي بيعرض كل مصروف كنسبة من الإيراد.","c":5,"ka":"ef676ba87901","ks":"4dc68e42d423","b":10},{"e":"Variance","a":"الانحراف / الفرق","x":"الفرق بين الفعلي والمتوقع أو بين فترتين.","s":"We asked management to explain the variance.","t":"طلبنا من الإدارة تفسير الانحراف.","c":5,"h":"ڤيريَنس","ka":"700bc90a2a50","ks":"f04d26d8f942","b":10},{"e":"Budget","a":"الموازنة التقديرية","x":"خطة مالية بالأرقام لفترة قادمة.","s":"Actual expenses exceeded the budget.","t":"المصروفات الفعلية تجاوزت الموازنة.","c":5,"ka":"822bead6c149","ks":"fc0dcc3c51f6","b":10},{"e":"Forecast","a":"التوقعات / التنبؤ","x":"تقدير للنتائج المالية المتوقعة بناءً على المعلومات الحالية.","s":"The cash flow forecast supports the going concern assumption.","t":"توقعات التدفقات النقدية بتؤيد فرض الاستمرارية.","c":5,"ka":"89c1265be62d","ks":"36706d063a67","b":10},{"e":"Break-even point","a":"نقطة التعادل","x":"مستوى المبيعات اللي عنده الإيرادات تساوي التكاليف.","s":"The project reaches its break-even point in the third year.","t":"المشروع بيوصل لنقطة التعادل في السنة التالتة.","c":5,"ka":"d3542a25fcfd","ks":"8ddbf18bdf34","b":10},{"e":"Fixed costs","a":"التكاليف الثابتة","x":"تكاليف مابتتغيرش مع حجم الإنتاج في المدى القصير، زي الإيجار.","s":"Rent and salaries are fixed costs.","t":"الإيجار والمرتبات تكاليف ثابتة.","c":5,"ka":"5b819258ca97","ks":"3488d070ee5e","b":10},{"e":"Variable costs","a":"التكاليف المتغيرة","x":"تكاليف بتتغير مع حجم الإنتاج، زي الخامات.","s":"Variable costs rise with production volume.","t":"التكاليف المتغيرة بتزيد مع حجم الإنتاج.","c":5,"ka":"404ba14aaea4","ks":"29dd3ff319bb","b":10},{"e":"Overheads","a":"التكاليف غير المباشرة","x":"تكاليف صناعية مش ممكن تتبعها لمنتج معين مباشرة.","s":"Overheads are allocated based on machine hours.","t":"التكاليف غير المباشرة بتتوزع على أساس ساعات الماكينات.","c":5,"ka":"80c1de39fc90","ks":"6c27f71b0b11","b":10},{"e":"Loan","a":"قرض","x":"مبلغ مقترض بيتسدد على فترة مع فائدة.","s":"The loan is repayable over five years.","t":"القرض بيتسدد على خمس سنين.","c":5,"ka":"9ad81a8f8a5c","ks":"afc25782534b","b":10},{"e":"Credit facility","a":"تسهيل ائتماني","x":"حد ائتماني بيمنحه البنك للشركة تسحب منه حسب الحاجة.","s":"The credit facility is renewed annually.","t":"التسهيل الائتماني بيتجدد سنويًا.","c":5,"ka":"a7128f7316fc","ks":"93936b99445e","b":10},{"e":"Collateral","a":"الضمان العيني","x":"أصل مرهون للمقرض ضمانًا للسداد.","s":"The land was pledged as collateral for the loan.","t":"الأرض اترهنت كضمان للقرض.","c":5,"h":"كُلاتِرَل","ka":"20288cb4d289","ks":"3a50f654100d","b":10},{"e":"Mortgage","a":"الرهن العقاري","x":"رهن عقار ضمانًا لقرض.","s":"The mortgage on the building is disclosed in the notes.","t":"الرهن على المبنى مفصح عنه في الإيضاحات.","c":5,"h":"مورجِدچ (حرف t مش بيتنطق)","ka":"59fc51925602","ks":"90fbc3e9f345","b":10},{"e":"Covenant","a":"تعهد مالي في عقد القرض","x":"شرط في عقد القرض بيلزم المقترض بنسب أو قيود معينة.","s":"Breaching a loan covenant may make the loan payable on demand.","t":"مخالفة تعهدات القرض ممكن تخلي القرض مستحق عند الطلب.","c":5,"h":"كَڤِنَنت","ka":"965ef4e5ba91","ks":"cb619ced497a","b":10},{"e":"Letter of guarantee","a":"خطاب الضمان","x":"تعهد من البنك بدفع مبلغ للمستفيد لو العميل أخلّ بالتزامه.","s":"The letter of guarantee is disclosed as a contingent liability.","t":"خطاب الضمان مفصح عنه كالتزام محتمل.","c":5,"h":"جارَنتي","ka":"3bf40bd77d42","ks":"f61047c61b2f","b":10},{"e":"Letter of credit","a":"الاعتماد المستندي","x":"تعهد من البنك بالدفع للمورد عند تقديم مستندات الشحن المطابقة.","s":"Imports are financed by a letter of credit.","t":"الواردات بتتمول باعتماد مستندي.","c":5,"ka":"7f80fd8f8e07","ks":"335d0a4331eb","b":10},{"e":"Maturity date","a":"تاريخ الاستحقاق","x":"التاريخ اللي بيستحق فيه سداد الدين أو الأداة المالية.","s":"The maturity date of the bond is 2030.","t":"تاريخ استحقاق السند 2030.","c":5,"h":"ماتشوريتي","ka":"0e205b0497cc","ks":"c64025d42026","b":10},{"e":"Principal","a":"أصل القرض","x":"المبلغ الأصلي المقترض من غير الفوائد.","s":"Each instalment covers principal and interest.","t":"كل قسط بيغطي أصل وفائدة.","c":5,"ka":"8804b01fe5f3","ks":"76f0a4cd6048","b":10},{"e":"Instalment","a":"قسط","x":"دفعة دورية من مبلغ مستحق.","s":"The third instalment is due in March.","t":"القسط التالت مستحق في مارس.","c":5,"ka":"0a6ca973a182","ks":"c59280a0f214","b":10},{"e":"Treasury bills","a":"أذون الخزانة","x":"أدوات دين حكومية قصيرة الأجل بتتباع بخصم.","s":"Income from treasury bills is subject to a separate tax.","t":"عائد أذون الخزانة خاضع لضريبة مستقلة.","c":5,"ka":"8d91442f7164","ks":"f3b1dc82fbf2","b":10},{"e":"Bonds","a":"السندات","x":"أدوات دين طويلة الأجل بعائد دوري.","s":"The company invested in government bonds.","t":"الشركة استثمرت في سندات حكومية.","c":5,"ka":"b98e3a37b62f","ks":"f63fbfc35ba3","b":10},{"e":"Shareholder","a":"مساهم","x":"مالك سهم أو أكتر في الشركة.","s":"Each shareholder has voting rights at the general assembly.","t":"كل مساهم ليه حقوق تصويت في الجمعية العامة.","c":5,"ka":"0287b0a13f32","ks":"e8c7872e4ca1","b":10},{"e":"Board of directors","a":"مجلس الإدارة","x":"الجهة المسؤولة عن إدارة الشركة واعتماد القوائم المالية.","s":"The board of directors approved the budget.","t":"مجلس الإدارة اعتمد الموازنة.","c":5,"ka":"8f31d7d63932","ks":"1c6e2ee10fa7","b":10},{"e":"General assembly","a":"الجمعية العامة","x":"اجتماع المساهمين اللي بيعتمد القوائم والتوزيعات ويعيّن مراقب الحسابات.","s":"The general assembly appointed the auditor.","t":"الجمعية العامة عيّنت مراقب الحسابات.","c":5,"ka":"049484f25f19","ks":"cb7640f9de89","b":10},{"e":"Articles of association","a":"النظام الأساسي","x":"المستند اللي بينظم إدارة الشركة وحقوق المساهمين.","s":"The articles of association set the profit distribution rules.","t":"النظام الأساسي بيحدد قواعد توزيع الأرباح.","c":5,"ka":"aa2875af2332","ks":"f273ea745e75","b":10},{"e":"Commercial register","a":"السجل التجاري","x":"سجل رسمي ببيانات الشركة القانونية.","s":"We obtained a recent extract of the commercial register.","t":"حصلنا على مستخرج حديث من السجل التجاري.","c":5,"ka":"4483b6c0c446","ks":"fe44ecc53393","b":10},{"e":"Liquidation","a":"التصفية","x":"إنهاء الشركة ببيع أصولها وسداد التزاماتها وتوزيع الباقي على المساهمين.","s":"The shareholders decided to put the company into liquidation.","t":"المساهمين قرروا وضع الشركة تحت التصفية.","c":5,"h":"لِكوِدَيشَن","ka":"f9eac3c01785","ks":"f46406decff3","b":10},{"e":"Merger","a":"الاندماج","x":"اتحاد شركتين أو أكتر في كيان واحد.","s":"The merger was approved by the regulator.","t":"الاندماج وافقت عليه الجهة الرقابية.","c":5,"h":"مِرچَر","ka":"ef85b1cef547","ks":"7bb5783cb5cf","b":10},{"e":"Acquisition","a":"الاستحواذ","x":"شراء شركة لحصة مسيطرة في شركة أخرى.","s":"The acquisition was completed in June.","t":"الاستحواذ تم في يونيو.","c":5,"h":"أكوِزِشَن","ka":"7a077d612f50","ks":"8259e3f4f4ac","b":10},{"e":"Microfinance","a":"التمويل متناهي الصغر","x":"تمويل بمبالغ صغيرة لأصحاب المشروعات الصغيرة ومحدودي الدخل.","s":"The microfinance portfolio grew by twenty percent.","t":"محفظة التمويل متناهي الصغر زادت 20%.","c":5,"ka":"722afa5689e6","ks":"5c38b875a62c","b":10},{"e":"Loan portfolio","a":"محفظة القروض","x":"إجمالي القروض الممنوحة للعملاء.","s":"We tested the loan portfolio for impairment.","t":"اختبرنا محفظة القروض للاضمحلال.","c":5,"ka":"1cc938756d36","ks":"5a230e4f2b7c","b":10},{"e":"Non-performing loans","a":"القروض غير المنتظمة (المتعثرة)","x":"قروض اتأخر سدادها مدة معينة أو مشكوك في تحصيلها.","s":"Non-performing loans rose during the year.","t":"القروض غير المنتظمة زادت خلال السنة.","c":5,"ka":"5bd779829199","ks":"fe18e965e0a4","b":10},{"e":"Tender","a":"مناقصة","x":"دعوة لتقديم عروض لتنفيذ أعمال أو توريد.","s":"The contractor won the tender.","t":"المقاول كسب المناقصة.","c":5,"ka":"6c9a3c787e97","ks":"c89ff323cd95","b":10},{"e":"Subcontractor","a":"مقاول الباطن","x":"مقاول بينفذ جزء من أعمال المقاول الرئيسي.","s":"Subcontractor costs are part of contract costs.","t":"تكاليف مقاولي الباطن جزء من تكاليف العقد.","c":5,"ka":"55fd5f71c7b3","ks":"57321c895c8f","b":10},{"e":"Progress billing","a":"المستخلص","x":"فاتورة دورية عن الأعمال المنفذة في عقود المقاولات.","s":"Progress billings are certified by the consultant.","t":"المستخلصات بيعتمدها الاستشاري.","c":5,"ka":"7ff0c3372f28","ks":"03f76643d429","b":11},{"e":"Advance payment","a":"دفعة مقدمة","x":"مبلغ بيتدفع قبل استلام السلعة أو الخدمة.","s":"The advance payment is deducted from each progress billing.","t":"الدفعة المقدمة بتتخصم من كل مستخلص.","c":5,"ka":"0601c9441f65","ks":"f4d800058ca3","b":11},{"e":"Entrepreneur","a":"رائد أعمال","x":"شخص بيبدأ مشروع جديد ويتحمّل مخاطرته على أمل يحقق ربح ونمو.","s":"Every entrepreneur on the show is looking for money and a strategic partner.","t":"كل رائد أعمال في البرنامج بيدوّر على فلوس وشريك استراتيجي.","c":6,"h":"أُنتربرينير","ka":"188431fdac0f","ks":"86c0dddcdc77","b":11},{"e":"Startup","a":"شركة ناشئة","x":"شركة جديدة في أول مراحلها، غالبًا بفكرة مبتكرة وهدفها النمو السريع.","s":"Most startups fail in their first three years.","t":"أغلب الشركات الناشئة بتفشل في أول تلات سنين.","c":6,"ka":"13e685964c25","ks":"b035937db0cb","b":11},{"e":"Founder","a":"المؤسس","x":"الشخص اللي أسس الشركة وغالبًا بيملك حصة كبيرة فيها.","s":"Investors bet on the founder as much as on the idea.","t":"المستثمرين بيراهنوا على المؤسس بقدر ما بيراهنوا على الفكرة.","c":6,"ka":"ad5b1a22767e","ks":"7461fc07b543","b":11},{"e":"Co-founder","a":"الشريك المؤسس","x":"شخص أسس الشركة مع المؤسس الرئيسي وشريكه في الملكية والإدارة.","s":"The co-founder handles operations while I focus on sales.","t":"الشريك المؤسس ماسك التشغيل وأنا مركّز على المبيعات.","c":6,"ka":"c42e7cd922d7","ks":"ae03f9f82e3f","b":11},{"e":"Pitch","a":"العرض التقديمي للمستثمرين","x":"عرض قصير ومقنع لفكرة المشروع علشان تقنع مستثمر يحط فلوس.","s":"She delivered a strong pitch in under five minutes.","t":"قدّمت عرض قوي في أقل من خمس دقايق.","c":6,"ka":"87f800274a7f","ks":"89e21d889423","b":11},{"e":"Elevator pitch","a":"عرض المصعد","x":"تلخيص المشروع في 30 ثانية تقريبًا، كأنك بتشرحه لحد معاك في الأسانسير.","s":"Can you give me your elevator pitch in one sentence?","t":"ممكن تديني عرضك المختصر في جملة واحدة؟","c":6,"h":"إليڤيتَر","ka":"720ac7a31e68","ks":"4cece57cc323","b":11},{"e":"Pitch deck","a":"عرض الشرائح للمستثمرين","x":"مجموعة شرائح بتشرح المشكلة والحل والسوق والأرقام والفريق والطلب.","s":"The pitch deck should be no more than twelve slides.","t":"عرض الشرائح المفروض مايزيدش عن 12 شريحة.","c":6,"ka":"a41a66f5a5bc","ks":"ee003f86d5e5","b":11},{"e":"Investor","a":"المستثمر","x":"شخص أو جهة بتحط فلوس في مشروع مقابل حصة أو عائد.","s":"The investor asked for a bigger stake.","t":"المستثمر طلب حصة أكبر.","c":6,"ka":"66076a4571f7","ks":"c0f99a73752d","b":11},{"e":"Angel investor","a":"المستثمر الملاك","x":"فرد غني بيستثمر فلوسه الشخصية في شركات ناشئة في بدايتها.","s":"An angel investor gave us our first fifty thousand dollars.","t":"مستثمر ملاك إدانا أول 50 ألف دولار.","c":6,"h":"إينچِل","ka":"c98f788a6e0c","ks":"e2d50c47572b","b":11},{"e":"Venture capital","a":"رأس المال المخاطر","x":"صناديق بتستثمر مبالغ كبيرة في شركات ناشئة سريعة النمو مقابل حصص، وبتقبل مخاطرة عالية.","s" const VOICES={buttery:'Buttery (افتراضي)',airy:'Airy',glassy:'Glassy',rounded:'Rounded'};

  }else if(MS==='iv'){
    h+=`<div class="card"><b>💡 نصايح سريعة للانترفيو</b><ul class="tips">
     <li>استخدم المصطلح في جملة كاملة قصيرة، مش كلمة لوحدها.</li>
     <li>ابدأ إجاباتك بأفعال توضّح دورك: <span class="en">I managed / I led / I was responsible for / I contributed to</span>.</li>

     ${IV.map((x,k)=>`<div class="dcard"><div class="sent" style="background:none;padding:0"><button class="ib" data-iv="${k}" aria-label="استمع">${IC.spk}</button><button class="ib" data-ivs="${k}" aria-label="ببطء">🐢</button><div><span class="se en">${esc(x[0])}</span><span class="sa">${esc(x[1])}</span></div></div></div>`).join('')}`;
  }else if(MS==='transfer'){
    h+=`<div class="card"><b>📦 نقل التقدم</b><p class="note">${SY.st==='ok'?'تقدمك متزامن تلقائيًا هنا، مش محتاج تنقله.':'التقدم محفوظ على الجهاز ده بس. علشان تنقله لجهاز تاني: انسخ الكود هنا، وابعته لنفسك (واتساب أو إيميل)، وعلى الجهاز التاني الصقه واضغط "استيراد". الكلمات اللي اتعلمتها على الجهازين بتتدمج مع بعض.'}</p>
     <div class="lbl">١. كود التقدم من الجهاز ده</div><textarea id="exp" readonly style="width:100%;height:80px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px;direction:ltr;font-size:.75rem">${esc(exportCode())}</textarea>
     <p><button class="btn soft" data-copy>📋 انسخ الكود</button></p>
     <div class="lbl">٢. استيراد كود من جهاز تاني</div><textarea id="imp" placeholder="الصق الكود هنا" style="width:100%;height:80px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px;direction:ltr;font-size:.75rem"></textarea>
     <p><button class="btn pr" data-import>⬇️ استيراد ودمج</button></p></div>`;
  }else if(MS==='abbr'){
    h+=`<div class="card"><b>الاختصارات المستخدمة</b><p class="note">دوس 🔊 تسمع الاختصار والاسم الكامل.</p><table>${ABBR.map((a,k)=>`<tr><td><button class="ib" data-abbr="${k}">${IC.spk}</button></td><td class="en"><b>${esc(a[0])}</b><br><span class="note">${esc(a[1])}</span></td><td>${esc(a[2])}</td></tr>`).join('')}</table></div>`;
  }else if(MS==='settings'){
    const vs=bVoices.map(v=>`<option ${v.name===(bVoice()||{}).name?'selected':''} value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');
    h+=`<div class="card"><b>🔊 الصوت والنطق</b>
     <div class="fld"><span>مصدر الصوت</span><select data-dev="eng"><option value="auto" ${dev.eng==='auto'?'selected':''}>🎙️ الصوت الطبيعي المسجّل (الأفضل)</option>${ENG.tts?`<option value="claude" ${dev.eng==='claude'?'selected':''}>صوت Claude المباشر</option>`:''}<option value="browser" ${dev.eng==='browser'?'selected':''}>صوت المتصفح</option></select></div>
     <p class="note" style="margin:4px 0">الصوت المسجّل متسجّل مسبقًا بصوت بشري طبيعي لكل كلمة وجملة، فبيطلع نقي وبنفس الجودة على اللاب والموبايل وأي جهاز.</p>
     ${dev.eng==='claude'&&ENG.tts?`<div class="fld"><span>صوت Claude</span><select data-dev="cv">${Object.keys(VOICES).map(k=>`<option value="${k}" ${dev.cv===k?'selected':''}>${VOICES[k]}</option>`).join('')}</select></div>`:''}
     ${dev.eng==='browser'?`<div class="fld"><span>صوت المتصفح</span><select data-dev="bv">${vs||'<option>الافتراضي</option>'}</select></div>`:''}
     <div class="fld"><span>سرعة النطق العادي: <b id="rv">${dev.rate}</b></span><input type="range" min="0.7" max="1.2" step="0.05" value="${dev.rate}" data-dev="rate"></div>
     <div class="fld"><label><input type="checkbox" data-dev="auto" ${dev.auto?'checked':''}> نطق الكلمة تلقائي لما تظهر في المذاكرة</label></div>
     <div class="fld"><button class="btn soft" data-test>${IC.spk} جرّب الصوت</button><span class="note">${ENG.dic?'🎤 تمرين النطق متاح':'🎤 تمرين النطق محتاج Chrome أو Edge أو Safari'}</span></div></div>
     <div class="card"><b>📅 المذاكرة اليومية</b>
     <div class="fld"><span>اسمك</span><input type="text" data-p="name" value="${esc(P.name)}" maxlength="30"></div>
     <div class="fld"><span>عدد الكلمات الجديدة يوميًا</span><select data-p="daily">${[5,10,15,20].map(n=>`<option ${P.daily===n?'selected':''}>${n}</option>`).join('')}</select></div>
     <div class="fld"><span>كلمات اليوم من</span><select data-p="focus"><option value="all">كل الأقسام</option>${CATS.map((c,i)=>`<option value="${i}" ${P.focus===String(i)?'selected':''}>${c}</option>`).join('')}</select></div>
     <p class="note">التغيير بيطبق على الكلمات الجديدة من بكرة (أو النهارده لو لسه فيه مكان).</p></div>
     <div class="card"><b>🎨 الشكل</b><div class="fld"><span>الوضع الليلي</span><select data-dev="theme"><option value="light" ${dev.theme!=='dark'?'selected':''}>فاتح</option><option value="dark" ${dev.theme==='dark'?'selected':''}>غامق</option></select></div></div>
     <div class="card"><b>⚠️ إعادة ضبط التقدم</b><p class="note">بيمسح كل اللي اتعلمته والسلسلة والمحفوظة.</p><button class="btn bad" data-reset>مسح التقدم</button></div>`;
  }else if(MS==='help'){
    h+=`<div class="card"><b>💡 خطة يومية (15–20 دقيقة)</b><ul class="tips">
     <li><b>كلمات النهارده:</b> كل يوم بيظهرلك ${P.daily} كلمات جديدة لحد ما تخلص الـ ${D.length} مصطلح.</li>
     <li><b>في كل كلمة:</b> اسمعها عادي، ثم ببطء، وكرّرها بصوت عالي 3 مرات، وبعدين جرّب 🎤 انطقها.</li>
     <li><b>اكشف المعنى</b> بعد ما تحاول تفتكره، واقرا الجملة بصوت عالي.</li>
     <li><b>كن صريح مع نفسك:</b> "لسه" مش عيب — الكلمة بترجعلك بكرة. "حافظها" بتبعدها: بعد يوم، 3، أسبوع، أسبوعين، شهر.</li>
     <li><b>المراجعة أهم من الجديد:</b> لو فيه رقم أحمر على "مذاكرة" خلّصه الأول.</li>
     <li><b>اختبار بعد الجلسة:</b> نوع "اسمع واكتب" بيثبّت الإملاء، و"انطق" بيثبّت النطق.</li>
     <li><b>في المواصلات:</b> استخدم الاستماع المتواصل على كلمات النهارده.</li>
     <li><b>استخدمها في الشغل:</b> حاول تكتب ملاحظة في ورقة عمل بالإنجليزي فيها كلمة من كلمات النهارده.</li></ul></div>`;
  }
  V.innerHTML=h;
}
/* ---------- sync ---------- */
const SY={ref:null,st:'local',busy:false,again:false,tm:null};
function syncLine(){const m={local:['','محفوظ على الجهاز ده بس (المزامنة مش متاحة هنا)'],loading:['wait','بيحمّل تقدمك…'],ok:['ok','متزامن ✓ — نفس التقدم على اللاب والموبايل'],off:['err','مش قادر يوصل للحفظ دلوقتي، هيحاول تاني'],ro:['err','الحفظ في السحابة مش مسموح للحساب ده — محفوظ على الجهاز بس']}[SY.st]||['',''];return`<span class="sync"><span class="dot ${m[0]}"></span>${m[1]}</span>`}
function exportCode(){try{return'VOC1.'+btoa(unescape(encodeURIComponent(JSON.stringify(P))))}catch(e){return''}}
function importCode(c){try{c=c.trim();if(!c.startsWith('VOC1.'))return false;const r=fixP(JSON.parse(decodeURIComponent(escape(atob(c.slice(5))))));P=merge(P,r);P.upd=Date.now();LS.set('vp2',P);schedulePush(true);return true}catch(e){return false}}
function setSy(s){SY.st=s;if(view==='more'&&!MS)render()}
function merge(a,b){const n=(a.upd||0)>=(b.upd||0)?a:b,o=n===a?b:a,r=clone(n);
  for(const e in o.st){const x=o.st[e],y=r.st[e];if(!y||(x.l??-1e9)>(y.l??-1e9)||(y.l==null&&x.i!=null&&x.i<y.i))r.st[e]=x}
  for(const d in o.days)r.days[d]=1;r.upd=Math.max(a.upd||0,b.upd||0);return fixP(r)}
async function initSync(){
  if(!(window.claude&&claude.use)){const w=webDic();if(w)initDic(w);SYready=true;render();return}
  claude.use('tts').then(t=>{if(t){ENG.tts=t;if(view==='more')render()}}).catch(()=>{});
  claude.use('dictation').then(d=>{if(d){initDic(d);render()}}).catch(()=>{});
  let db=null,u=null;try{[db,u]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(!db||!u){SYready=true;setSy('local');render();return}
  let id=null;try{id=await u.id()}catch(e){}
  if(!id){SYready=true;setSy('local');render();return}
  try{SY.ref=db.doc('data/users/'+id+'/progress')}catch(e){SYready=true;setSy('local');render();return}
  await pull(true);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!SY.busy)pull(false)});
}
async function pull(first){
  if(first)setSy('loading');
  const timer=setTimeout(()=>{if(!SYready){SYready=true;render()}setSy('off')},10000);
  try{const s=await SY.ref.get();clearTimeout(timer);
    const local=P;let changed=false;
    if(s.exists){const r=fixP(clone(s.data()||{}));const m=merge(local,r);const ms=JSON.stringify(m);changed=ms!==JSON.stringify(local);P=m;LS.set('vp2',P);if(ms!==JSON.stringify(r))schedulePush(true)}
    else schedulePush(true);
    SY.st='ok';SYready=true;if(first||changed)render();else if(view==='more'&&!MS)render();
  }catch(e){clearTimeout(timer);SYready=true;setSy('off');if(first)render()}
}
function schedulePush(now){if(!SY.ref)return;clearTimeout(SY.tm);SY.tm=setTimeout(push,now?50:1200)}
async function push(){if(!SY.ref||SY.st==='ro')return;if(SY.busy){SY.again=true;return}SY.busy=true;
  try{await SY.ref.set(clone(P));if(SY.st!=='ok')setSy('ok')}catch(e){if(e&&e.code==='invalid_argument')setSy('ro');else setSy('off')}
  SY.busy=false;if(SY.again){SY.again=false;push()}}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-open]');
  if(!b){if(e.target.id==='ov')closeSheet();return}
  const d=b.dataset,W=k=>D[+k];
  if(d.say!=null){e.stopPropagation();return playBtn(b,W(d.say).e)}
  if(d.slow!=null)return playBtn(b,W(d.slow).e,true);
  if(d.sent!=null)return playBtn(b,W(d.sent).s);
  if(d.iv!=null)return playBtn(b,IV[+d.iv][0]);
  if(d.ivs!=null)return playBtn(b,IV[+d.ivs][0],true);
  if(d.abbr!=null){const a=ABBR[+d.abbr];return playBtn(b,a[0]+'. '+a[1])}
  if(d.mic!=null)return startPron(b,W(d.mic),b.closest('.dt,.flash,.dcard,.card').querySelector('.pron'));
  if(d.fav!=null){toggleFav(W(d.fav));b.classList.toggle('fav');return}
  if(d.open!=null)return openSheet(W(d.open));
  if(d.close!=null)return closeSheet();
  if(d.rate!=null){rate(W(d.rate),d.k==='1');closeSheet();toast(d.k==='1'?'تمام ✅ هتظهرلك في المراجعة بعدين':'هترجعلك بكرة للمراجعة 🔁');return render()}
  if(d.go){closeSheet();if(d.go==='study'&&view!=='study')SS=null;if(d.go==='quiz'&&QZ.phase!=='run')QZ.phase='setup';if(d.go==='more')MS=null;return go(d.go)}
  if(d.cat!=null){DQ.cat=d.cat;DQ.shown=30;$('#q').value='';return go('dict')}
  if(d.dcat!=null){if(e.target.closest('.dtools'))$('#q').value='';DQ.cat=d.dcat;DQ.shown=30;return render()}
  if(d.more!=null){DQ.shown+=30;return render()}
  if(d.study!=null){closeSheet();return startStudy(d.study)}
  if(d.reveal!=null){SS.rev=true;return render()}
  if(d.sr!=null)return studyRate(d.sr==='1');
  if(d.endstudy!=null){SS=null;return render()}
  if(d.quizset!=null){QZ.set=d.quizset.split(',').filter(Boolean).map(Number).map(k=>D[k]);QZ.src='set';QZ.type='mix';go('quiz');return startQuiz()}
  if(d.qsrc!=null){QZ.src=d.qsrc;return render()}
  if(d.qtype!=null){QZ.type=d.qtype;return render()}
  if(d.qstart!=null||d.qagain!=null)return startQuiz();
  if(d.qsetup!=null){QZ.phase='setup';if(QZ.src==='set')QZ.src='today';return render()}
  if(d.qopt!=null){if(QZ.ans)return;const w=QZ.items[QZ.k].w,ok=+d.qopt===w.i;V.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.qopt===w.i)o.classList.add('ok')});if(!ok)b.classList.add('no');return qAnswer(ok)}
  if(d.qcheck!=null){const w=QZ.items[QZ.k].w,v=$('#ans').value;const ok=pn(v)===pn(w.e);$('#ans').disabled=true;b.disabled=true;return qAnswer(ok,ok?'':'كتبت: '+esc(v||'—')+' — الصحيح:')}
  if(d.qmic!=null){const w=QZ.items[QZ.k].w;return startPron(b,w,V.querySelector('.card .pron'),sc=>{if(sc>=.7)qAnswer(true);else if(sc>0)toast('قرّب أكتر، جرّب تاني أو تخطّي')})}
  if(d.qskip!=null)return qAnswer(false,'اتخطّيت السؤال:');
  if(d.qnext!=null){QZ.k++;QZ.ans=false;if(QZ.k>=QZ.items.length)QZ.phase='end';render();return qAuto()}
  if(d.ms!=null){stopPlayer();MS=d.ms||null;return render()}
  if(d.psrc!=null){PL.src=d.psrc;stopPlayer();return render()}
  if(b.id==='ivgo'){if(PL.on){stopPlayer();b.textContent='▶ اسمع كل الجمل ورا بعض';return}b.textContent='⏹ إيقاف';(async()=>{const tok=++PL.tok;PL.on=true;for(const x of IV){if(tok!==PL.tok)return;if(!await speak(x[0])||tok!==PL.tok)break;await new Promise(r=>setTimeout(r,1500))}if(tok===PL.tok){PL.on=false;const g=$('#ivgo');if(g)g.textContent='▶ اسمع كل الجمل ورا بعض'}})();return}
  if(b.id==='pgo'){if(PL.on){stopPlayer();b.textContent='▶ تشغيل'}else{b.textContent='⏹ إيقاف';runPlayer()}return}
  if(d.pstop!=null){stopPlayer();const g=$('#pgo');if(g)g.textContent='▶ تشغيل';return}
  if(d.test!=null)return playBtn(b,'Financial statements. Professional scepticism.');
  if(d.copy!=null){const t=$('#exp');t.select();const ok=()=>toast('اتنسخ ✓ ابعته لنفسك والصقه على الجهاز التاني');
    try{navigator.clipboard.writeText(t.value).then(ok,()=>{try{document.execCommand('copy');ok()}catch(e){toast('حدّد الكود وانسخه يدوي')}})}catch(e){toast('حدّد الكود وانسخه يدوي')}return}
  if(d.import!=null){if(importCode($('#imp').value)){toast('تم الاستيراد والدمج ✓');render()}else toast('الكود مش صحيح');return}
  if(d.savename!=null){const v=$('#nm').value.trim();if(v){P.name=v;save();render()}return}
  if(d.reset!=null){if(b.dataset.sure){P=fixP({name:P.name,daily:P.daily,focus:P.focus});save();toast('اتمسح التقدم');return render()}b.dataset.sure=1;b.textContent='متأكد؟ دوس تاني للمسح';return}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(t.id==='pshuf')PL.shuf=t.checked;if(t.id==='psent')PL.sent=t.checked;
  if(d.dev){dev[d.dev]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;saveDev();if(d.dev==='theme')document.documentElement.dataset.theme=dev.theme;if(d.dev!=='rate')render()}
  if(d.p){if(d.p==='daily')P.daily=+t.value;else if(d.p==='focus')P.focus=t.value;else P.name=t.value.trim();save();header()}
});
document.addEventListener('input',e=>{if(e.target.dataset.dev==='rate'){dev.rate=+e.target.value;const r=$('#rv');if(r)r.textContent=dev.rate}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'){const c=V.querySelector('[data-qcheck]');c&&!c.disabled&&c.click()}if(e.key==='Escape')closeSheet()});
$('#q').addEventListener('input',()=>{DQ.shown=30;if(view!=='dict'){view='dict';try{history.replaceState(null,'','#dict')}catch(e){}header()}vDict()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==view)go(h,false)});
document.documentElement.dataset.theme=dev.theme;
if(TTS){loadVoices();try{speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==='more'&&MS==='settings')render()}}catch(e){}}
view=TITLES.hasOwnProperty(location.hash.slice(1))?location.hash.slice(1):'home';
render();
setTimeout(initSync,0);
</script>
